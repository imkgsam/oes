    expose: ['50051']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: permission-service

  public-entry-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: public-entry-service
        SERVICE_PATH: src/services/system/public-entry-service
    environment:
      <<: *service-environment
      MODULE_NAME: public-entry-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/public-entry-service
      DATABASE_URL: ${OES_DB_PUBLIC_ENTRY_SERVICE_URL:?run pnpm db:config}
