      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/notification-service
      DATABASE_URL: ${OES_DB_NOTIFICATION_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50066
      NATS_NOTIFICATION_USER: ${NATS_NOTIFICATION_USER:?run pnpm db:config}
      NATS_NOTIFICATION_PASSWORD: ${NATS_NOTIFICATION_PASSWORD:?run pnpm db:config}
      NATS_URL: nats://nats:4222
    expose: ['50066']
    volumes:
      - type: volume
        source: grpc_trust_runtime
