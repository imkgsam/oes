      MODULE_NAME: item-master-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/item-master-service
      DATABASE_URL: ${OES_DB_ITEM_MASTER_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50058
    expose: ['50058']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: item-master-service

  notification-service:
