  terminal-device-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: terminal-device-service
        SERVICE_PATH: src/services/system/terminal-device-service
    environment:
      <<: *service-environment
