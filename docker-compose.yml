    expose: ['50069']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: site-service

  tenant-org-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: tenant-org-service
        SERVICE_PATH: src/services/system/tenant-org-service
    environment:
      <<: *service-environment
      MODULE_NAME: tenant-org-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/tenant-org-service
      DATABASE_URL: ${OES_DB_TENANT_ORG_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50054
    expose: ['50054']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
