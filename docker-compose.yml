      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/identity-service
      DATABASE_URL: ${OES_DB_IDENTITY_SERVICE_URL:?run pnpm db:config}
