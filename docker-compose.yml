include:
  - path: docker-compose.infra.yml

x-service-defaults: &service-defaults
  labels:
    oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
    oes.local.scope: infrastructure-databases
  networks: [oes_network]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    otel-collector: { condition: service_started }
    grpc-trust-bootstrap: { condition: service_completed_successfully }
  restart: unless-stopped

x-event-service-defaults: &event-service-defaults
  <<: *service-defaults
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    otel-collector: { condition: service_started }
    nats-bootstrap: { condition: service_completed_successfully }
    grpc-trust-bootstrap: { condition: service_completed_successfully }

x-service-environment: &service-environment
  NODE_ENV: development
  GRPC_LISTEN_HOST: 0.0.0.0
  REDIS_HOST: redis
  REDIS_PORT: 6379
  NACOS_SERVER: nacos:8848
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  AUTH_SERVICE_HOST: auth-service
  AUTH_SERVICE_PORT: 50050
  AUTH_EXECUTION_ISSUER: https://issuer.local.oes.internal
  AUTH_EXECUTION_WORKLOAD_POLICIES: ${AUTH_EXECUTION_WORKLOAD_POLICIES:?run node scripts/local/workload-policy-profile.mjs and project into the task-owned env}
  OES_GRPC_TLS_ENABLED: 'true'
  OES_GRPC_TLS_MIN_VERSION: TLSv1.2
  OES_GRPC_TLS_CA_PATH: /trust/current/ca.pem

services:
  execution-token-signer:
    build:
      context: ./docker/grpc-trust/execution-token-signer
      dockerfile: local/softhsm2/Dockerfile
    labels:
      oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
      oes.local.scope: business-journey
    network_mode: none
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      EXECUTION_SIGNER_HOST_WORK_DIR: /tmp/signer
      EXECUTION_SIGNER_RUNTIME_MODE: '1'
      AUTH_EXECUTION_SIGNER_SOCKET_PATH: /execution-signer/signer.sock
      EXECUTION_SIGNER_READY_PATH: /execution-signer/ready
    healthcheck:
      test: [CMD-SHELL, 'test -S /execution-signer/signer.sock && test -s /execution-signer/ready']
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    tmpfs: ['/tmp:mode=1777,exec,size=256m']
    volumes: [execution_signer_runtime:/execution-signer]

  grpc-trust-bootstrap:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    labels:
      oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
      oes.local.scope: infrastructure-databases
    command:
      [
        '/bin/sh',
        '-ec',
        'apk add --no-cache bash openssl && exec /scripts/bootstrap-local-trust.sh --output /trust'
      ]
    environment:
      OES_TRUST_ENV: local
      OES_TRUST_OUTPUT_DIRECTORY: /trust
      OES_ROTATION_CHECK_INTERVAL_SECONDS: 300
    volumes:
      - ./docker/grpc-trust:/scripts:ro
      - grpc_trust_runtime:/trust
    networks: [oes_network]

  grpc-trust-rotator:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    labels:
      oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
      oes.local.scope: infrastructure-databases
    command:
      ['/bin/sh', '-ec', 'apk add --no-cache bash openssl && exec /scripts/rotate-local-trust.sh']
    depends_on:
      grpc-trust-bootstrap: { condition: service_completed_successfully }
    environment:
      OES_TRUST_ENV: local
      OES_TRUST_OUTPUT_DIRECTORY: /trust
      OES_ROTATION_CHECK_INTERVAL_SECONDS: 300
    restart: unless-stopped
    volumes:
      - ./docker/grpc-trust:/scripts:ro
      - grpc_trust_runtime:/trust
    networks: [oes_network]

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    environment:
      <<: *service-environment
      MODULE_NAME: api-gateway
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/api-gateway
      SERVICE_PORT: 9101
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 50050
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 50052
      PERMISSION_SERVICE_HOST: permission-service
      PERMISSION_SERVICE_PORT: 50051
      PARTY_SERVICE_HOST: party-service
      PARTY_SERVICE_PORT: 50053
      TENANT_ORG_SERVICE_HOST: tenant-org-service
      TENANT_ORG_SERVICE_PORT: 50054
      HR_SERVICE_HOST: hr-service
      HR_SERVICE_PORT: 50055
      ASSET_SERVICE_HOST: asset-service
      ASSET_SERVICE_PORT: 50056
      TERMINAL_DEVICE_SERVICE_HOST: terminal-device-service
      TERMINAL_DEVICE_SERVICE_PORT: 50057
      ITEM_MASTER_SERVICE_HOST: item-master-service
      ITEM_MASTER_SERVICE_PORT: 50058
      SALES_SERVICE_HOST: sales-service
      SALES_SERVICE_PORT: 50059
      CRM_SERVICE_HOST: crm-service
      CRM_SERVICE_PORT: 50060
      SRM_SERVICE_HOST: srm-service
      SRM_SERVICE_PORT: 50061
      PROCUREMENT_SERVICE_HOST: procurement-service
      PROCUREMENT_SERVICE_PORT: 50062
      FINANCE_SERVICE_HOST: finance-service
      FINANCE_SERVICE_PORT: 50063
      WMS_SERVICE_HOST: wms-service
      WMS_SERVICE_PORT: 50064
      MES_SERVICE_HOST: mes-service
      MES_SERVICE_PORT: 50065
      PUBLIC_ENTRY_SERVICE_HOST: public-entry-service
      PUBLIC_ENTRY_SERVICE_PORT: 50067
      COLLABORATION_SERVICE_HOST: collaboration-service
      COLLABORATION_SERVICE_PORT: 50068
      SITE_SERVICE_HOST: site-service
      SITE_SERVICE_PORT: 50069
      BROWSER_ACTIVITY_SERVICE_HOST: browser-activity-service
      BROWSER_ACTIVITY_SERVICE_PORT: 50070
      GATEWAY_READINESS_TIMEOUT_MS: 1000
      GATEWAY_READINESS_TARGETS: >-
        auth-service=grpcs://auth-service:50050,
        permission-service=grpcs://permission-service:50051,
        identity-service=grpcs://identity-service:50052,
        party-service=grpcs://party-service:50053,
        tenant-org-service=grpcs://tenant-org-service:50054,
        hr-service=grpcs://hr-service:50055,
        asset-service=grpcs://asset-service:50056,
        terminal-device-service=grpcs://terminal-device-service:50057,
        item-master-service=grpcs://item-master-service:50058,
        sales-service=grpcs://sales-service:50059,
        crm-service=grpcs://crm-service:50060,
        srm-service=grpcs://srm-service:50061,
        procurement-service=grpcs://procurement-service:50062,
        finance-service=grpcs://finance-service:50063,
        wms-service=grpcs://wms-service:50064,
        mes-service=grpcs://mes-service:50065,
        public-entry-service=grpcs://public-entry-service:50067,
        collaboration-service=grpcs://collaboration-service:50068,
        site-service=grpcs://site-service:50069,
        browser-activity-service=grpcs://browser-activity-service:50070
    ports: ['127.0.0.1::9101']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9101/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: api-gateway

  apisix:
    image: apache/apisix:3.13.0-debian@sha256:c5c7a55ebb5c07abc210dbb963a37f41030e12c91d23bacedbaa168fec633bd7
    labels:
      oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
      oes.local.scope: gateway-events
    volumes:
      - ./docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./docker/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports: ['127.0.0.1::9080']
    networks: [oes_network]
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9080/health/ready >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  asset-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: asset-service
        SERVICE_PATH: src/services/system/asset-service
    environment:
      <<: *service-environment
      MODULE_NAME: asset-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/asset-service
      DATABASE_URL: ${OES_DB_ASSET_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50056
      ASSET_S3_ENDPOINT: http://minio:9000
      ASSET_S3_BUCKET: ${MINIO_BUCKET:-oes-local-assets}
      ASSET_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run pnpm db:config}
      ASSET_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run pnpm db:config}
    expose: ['50056']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: asset-service

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: auth-service
        SERVICE_PATH: src/services/system/auth-service
    environment:
      <<: *service-environment
      MODULE_NAME: auth-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/auth-service
      DATABASE_URL: ${OES_DB_AUTH_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50050
      AUTH_HTTP_PORT: 50051
      AUTH_EXECUTION_SIGNER_SOCKET_PATH: /execution-signer/signer.sock
      AUTH_EXECUTION_KMS_KEY_REF: pkcs11:deployment-owned-local-reference
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
      grpc-trust-bootstrap: { condition: service_completed_successfully }
      execution-token-signer: { condition: service_healthy }
    expose: ['50050']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:50051/.well-known/jwks.json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      oes_network:
        aliases: [issuer.local.oes.internal]
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: auth-service
      - type: volume
        source: execution_signer_runtime
        target: /execution-signer
        read_only: true

  execution-token-issuer:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    labels:
      oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
      oes.local.scope: business-journey
    network_mode: service:auth-service
    depends_on:
      auth-service: { condition: service_healthy }
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    tmpfs:
      - '/tmp:mode=1777,size=16m'
      - '/var/cache/nginx:mode=0755,size=16m'
      - '/var/run:mode=0755,size=1m'
    volumes:
      - ./scripts/local/runtime-config/execution-token-issuer.nginx.conf:/etc/nginx/nginx.conf:ro
      - type: volume
        source: grpc_trust_runtime
        target: /auth-trust
        read_only: true
        volume:
          subpath: auth-service
    restart: unless-stopped

  browser-activity-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: browser-activity-service
        SERVICE_PATH: src/services/system/browser-activity-service
    environment:
      <<: *service-environment
      MODULE_NAME: browser-activity-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/browser-activity-service
      DATABASE_URL: ${OES_DB_BROWSER_ACTIVITY_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50070
    expose: ['50070']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: browser-activity-service

  collaboration-service:
    <<: *event-service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: collaboration-service
        SERVICE_PATH: src/services/system/collaboration-service
    environment:
