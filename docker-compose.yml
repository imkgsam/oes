      MODULE_NAME: collaboration-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/collaboration-service
      DATABASE_URL: ${OES_DB_COLLABORATION_SERVICE_URL:?run pnpm db:config}
      GRPC_LISTEN_PORT: 50068
      NATS_COLLABORATION_USER: ${NATS_COLLABORATION_USER:?run pnpm db:config}
      NATS_COLLABORATION_PASSWORD: ${NATS_COLLABORATION_PASSWORD:?run pnpm db:config}
      NATS_URL: nats://nats:4222
      COLLABORATION_OUTBOX_INTERVAL_MS: 1000
      COLLABORATION_DATABASE_URL: ${OES_DB_COLLABORATION_SERVICE_URL:?run pnpm db:config}
    expose: ['50068']
    volumes:
      - type: volume
        source: grpc_trust_runtime
        target: /trust
        read_only: true
        volume:
          subpath: collaboration-service

  hr-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PACKAGE_NAME: hr-service
        SERVICE_PATH: src/services/system/hr-service
    environment:
      <<: *service-environment
      MODULE_NAME: hr-service
      OES_GRPC_TLS_CERT_PATH: /trust/current/cert.pem
      OES_GRPC_TLS_KEY_PATH: /trust/current/key.pem
      OES_WORKLOAD_SPIFFE_ID: spiffe://local.oes.internal/ns/oes/sa/hr-service
      DATABASE_URL: ${OES_DB_HR_SERVICE_URL:?run pnpm db:config}
