syntax = "proto3";

package identity_service;

option java_multiple_files = true;
option java_package = "com.oes.identity.v1";

service IdentityQueryService {
  rpc GetAccountById(GetAccountByIdRequest) returns (GetAccountByIdResponse);
  rpc GetEmployeeBindingByAccountId(GetEmployeeBindingByAccountIdRequest) returns (GetEmployeeBindingByAccountIdResponse);
  rpc ResolveEmployeeLoginAccount(ResolveEmployeeLoginAccountRequest) returns (ResolveEmployeeLoginAccountResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc GetApiKeyById(GetApiKeyByIdRequest) returns (GetApiKeyByIdResponse);
  rpc GetServiceAccountById(GetServiceAccountByIdRequest) returns (GetServiceAccountByIdResponse);
  // Resolves Identity-owned Integration Machine lifecycle facts only for Auth's trusted external API-key exchange.
  rpc ResolveIntegrationMachineForAuth(ResolveIntegrationMachineForAuthRequest) returns (ResolveIntegrationMachineForAuthResponse);
  // Resolves only an Auth-verified first-party MACHINE principal and exact workload binding.
  rpc ResolveMachinePrincipalForAuth(ResolveMachinePrincipalForAuthRequest) returns (ResolveMachinePrincipalForAuthResponse);
  rpc ListApiKeysByServiceAccountId(ListApiKeysByServiceAccountIdRequest) returns (ListApiKeysByServiceAccountIdResponse);
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc ResolveContactActionTargets(ResolveContactActionTargetsRequest) returns (ResolveContactActionTargetsResponse);
  rpc ListAccountContactAssets(ListAccountContactAssetsRequest) returns (ListAccountContactAssetsResponse);
  rpc ListAccountWorkEmailAssets(ListAccountWorkEmailAssetsRequest) returns (ListAccountWorkEmailAssetsResponse);
  rpc ListAccountWorkPhoneAssets(ListAccountWorkPhoneAssetsRequest) returns (ListAccountWorkPhoneAssetsResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc GetUserByPhone(GetUserByPhoneRequest) returns (GetUserByPhoneResponse);
  rpc GetAccountsByUserId(GetAccountsByUserIdRequest) returns (GetAccountsByUserIdResponse);
  rpc CountTenantAccounts(CountTenantAccountsRequest) returns (CountTenantAccountsResponse);
}

message ListAuditEventsRequest {
  string service = 1;
  string module = 2;
  string event_type = 3;
  string result = 4;
  string operator_id = 5;
  string tenant_id = 6;
  string org_id = 7;
  string resource_type = 8;
  string resource_id = 9;
  string occurred_at_from = 10;
  string occurred_at_to = 11;
  string cursor = 12;
  int32 page_size = 13;
}

message AuditEventRecord {
  string event_id = 1;
  string service = 2;
  string module = 3;
  string event_type = 4;
  string occurred_at = 5;
  string result = 6;
  string operator_id = 7;
  string operator_type = 8;
  string tenant_id = 9;
  string org_id = 10;
  string trace_id = 11;
  string resource_type = 12;
  string resource_id = 13;
  string details_json = 14;
}

message ListAuditEventsResponse {
  repeated AuditEventRecord items = 1;
  string next_cursor = 2;
}

service IdentityManagementService {
  rpc RotateApiKey(RotateApiKeyRequest) returns (RotateApiKeyResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  rpc CreateUserAccount(CreateUserAccountRequest) returns (CreateUserAccountResponse);
  rpc GetAccountDeletionImpact(GetAccountDeletionImpactRequest) returns (GetAccountDeletionImpactResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  rpc SetServiceAccountEnabled(SetServiceAccountEnabledRequest) returns (SetServiceAccountEnabledResponse);
  rpc UpdateOwnAccountProfile(UpdateOwnAccountProfileRequest) returns (UpdateOwnAccountProfileResponse);
  rpc UpdateOwnUserBasicInfo(UpdateOwnUserBasicInfoRequest) returns (UpdateOwnUserBasicInfoResponse);
  rpc UpdateAccountProfile(UpdateAccountProfileRequest) returns (UpdateAccountProfileResponse);
  rpc UpdateUserBasicInfo(UpdateUserBasicInfoRequest) returns (UpdateUserBasicInfoResponse);
  rpc AssignAccountWorkEmailAsset(AssignAccountWorkEmailAssetRequest) returns (AssignAccountWorkEmailAssetResponse);
  rpc AssignAccountWorkPhoneAsset(AssignAccountWorkPhoneAssetRequest) returns (AssignAccountWorkPhoneAssetResponse);
  rpc RevokeAccountWorkEmailAsset(RevokeAccountWorkEmailAssetRequest) returns (RevokeAccountWorkEmailAssetResponse);
  rpc RevokeAccountWorkPhoneAsset(RevokeAccountWorkPhoneAssetRequest) returns (RevokeAccountWorkPhoneAssetResponse);
  rpc SetAccountWorkEmailAssetStatus(SetAccountWorkEmailAssetStatusRequest) returns (SetAccountWorkEmailAssetStatusResponse);
  rpc SetAccountWorkPhoneAssetStatus(SetAccountWorkPhoneAssetStatusRequest) returns (SetAccountWorkPhoneAssetStatusResponse);
  rpc SetAccountPrimaryWorkEmailAsset(SetAccountPrimaryWorkEmailAssetRequest) returns (SetAccountPrimaryWorkEmailAssetResponse);
  rpc SetAccountPrimaryWorkPhoneAsset(SetAccountPrimaryWorkPhoneAssetRequest) returns (SetAccountPrimaryWorkPhoneAssetResponse);
  rpc BindAccountToEmployee(BindAccountToEmployeeRequest) returns (BindAccountToEmployeeResponse);
  rpc UnbindAccountFromEmployee(UnbindAccountFromEmployeeRequest) returns (UnbindAccountFromEmployeeResponse);
  // Enrolls one first-party Machine Principal to one exact workload SPIFFE identity.
  rpc EnrollMachineWorkloadBinding(EnrollMachineWorkloadBindingRequest) returns (EnrollMachineWorkloadBindingResponse);
  // Disables one binding with optimistic version matching and no historical resurrection.
  rpc DisableMachineWorkloadBinding(DisableMachineWorkloadBindingRequest) returns (DisableMachineWorkloadBindingResponse);
}

service IdentityMachineAuthService {
  rpc AuthenticateApiKey(AuthenticateApiKeyRequest) returns (AuthenticateApiKeyResponse);
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserSummary user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UserSummary {
  string id = 1;
  string username = 2;
  string personal_email = 3;
  string personal_phone = 4;
  bool is_active = 5;
  reserved 6;
  reserved "party_id";
}

message GetUserByEmailResponse {
  UserSummary user = 1;
}

message GetUserByPhoneRequest {
  string phone = 1;
}

message GetUserByPhoneResponse {
  UserSummary user = 1;
}

message ListAccountsRequest {
  string keyword = 1;
  string scope_level = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
  string tenant_id = 6;
}

message AccountDirectoryItem {
  string account_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string scope_level = 4;
  string display_name = 5;
  bool is_enabled = 6;
  string user_display_name = 7;
  string tenant_party_id = 8;
}

message ListAccountsResponse {
  repeated AccountDirectoryItem accounts = 1;
  int32 total = 2;
}

message CountTenantAccountsRequest {
  repeated string tenant_ids = 1;
  string scope_level = 2;
  string status = 3;
}

message TenantAccountCount {
  string tenant_id = 1;
  int32 total = 2;
}

message CountTenantAccountsResponse {
  repeated TenantAccountCount counts = 1;
}

message CreateUserAccountRequest {
  string scope_level = 1;
  string tenant_id = 2;
  string display_name = 3;
  string username = 4;
  string email = 5;
  string phone = 6;
  string idempotency_key = 7;
  string existing_user_id = 8;
  string tenant_party_id = 9;
}

message BindAccountToEmployeeRequest {
  string tenant_id = 1;
  string account_id = 2;
  string employee_id = 3;
}

message UnbindAccountFromEmployeeRequest {
  string account_id = 1;
}

message GetAccountDeletionImpactRequest {
  string account_id = 1;
}

message AccountDeletionCleanupPlan {
  bool will_delete_sessions = 1;
  bool will_clear_roles = 2;
  bool will_delete_contact_assets = 4;
  reserved 3;
  reserved "will_delete_org_memberships";
}

message AccountDeletionBlockingReason {
  string resource_type = 1;
  int32 resource_count = 2;
  string message = 3;
}

message GetAccountDeletionImpactResponse {
  string account_id = 1;
  bool can_delete = 2;
  bool user_retained = 3;
  AccountDeletionCleanupPlan cleanup_plan = 4;
  repeated AccountDeletionBlockingReason blocking_reasons = 5;
  int32 contact_asset_count = 7;
  reserved 6;
  reserved "org_membership_count";
}

message DeleteAccountRequest {
  string account_id = 1;
  int32 deleted_session_count = 2;
  int32 cleared_role_count = 3;
  int32 deleted_policy_count = 4;
}

message DeleteAccountResponse {
  string account_id = 1;
  int32 deleted_contact_asset_count = 3;
  bool user_retained = 4;
  reserved 2;
  reserved "deleted_org_membership_count";
}

message UpdateUserBasicInfoRequest {
  string account_id = 1;
  string user_id = 2;
  string email = 3;
  string phone = 4;
}

message UpdateOwnUserBasicInfoRequest {
  string account_id = 1;
  string user_id = 2;
  string email = 3;
  string phone = 4;
}

message AccountContactAsset {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string type = 4;
  string value = 5;
  string status = 6;
  bool is_primary = 7;
  string assigned_at = 8;
  string revoked_at = 9;
  string user_id = 10;
  string employee_id = 11;
  string provider = 12;
  string display_name = 13;
  string ownership = 14;
  repeated string usage = 15;
  string released_at = 16;
}

message AccountContactAssetResponse {
  AccountContactAsset asset = 1;
}

message AssignAccountWorkEmailAssetResponse {
  AccountContactAsset asset = 1;
}

message AssignAccountWorkPhoneAssetResponse {
  AccountContactAsset asset = 1;
}

message RevokeAccountWorkEmailAssetResponse {
  AccountContactAsset asset = 1;
}

message RevokeAccountWorkPhoneAssetResponse {
  AccountContactAsset asset = 1;
}

message SetAccountWorkEmailAssetStatusResponse {
  AccountContactAsset asset = 1;
}

message SetAccountWorkPhoneAssetStatusResponse {
  AccountContactAsset asset = 1;
}

message SetAccountPrimaryWorkEmailAssetResponse {
  AccountContactAsset asset = 1;
}

message SetAccountPrimaryWorkPhoneAssetResponse {
  AccountContactAsset asset = 1;
}

message ListAccountWorkEmailAssetsRequest {
  string account_id = 1;
}

message ListAccountWorkEmailAssetsResponse {
  repeated AccountContactAsset assets = 1;
}

message ListAccountWorkPhoneAssetsRequest {
  string account_id = 1;
}

message ListAccountWorkPhoneAssetsResponse {
  repeated AccountContactAsset assets = 1;
}

message ContactActionTargetRef {
  string contact_action_type = 1;
  string target_ref_type = 2;
  string target_ref_id = 3;
}

message ContactAssetPublicValueSummary {
  string type = 1;
  string provider = 2;
  string label = 3;
  string display_value = 4;
  string action_value = 5;
  string action_uri = 6;
  bool include_in_v_card_allowed = 7;
}

message ResolvedContactActionTarget {
  string contact_action_type = 1;
  string target_ref_type = 2;
  string target_ref_id = 3;
  bool renderable = 4;
  string hidden_reason = 5;
  ContactAssetPublicValueSummary public_value_summary = 6;
}

message ResolveContactActionTargetsRequest {
  string tenant_id = 1;
  string account_id = 2;
  string employee_id = 3;
  repeated ContactActionTargetRef target_refs = 4;
}

message ResolveContactActionTargetsResponse {
  repeated ResolvedContactActionTarget targets = 1;
}

message ListAccountContactAssetsRequest {
  string tenant_id = 1;
  string account_id = 2;
  string employee_id = 3;
  repeated string types = 4;
  repeated string statuses = 5;
  repeated string ownership = 6;
}

message ListAccountContactAssetsResponse {
  repeated AccountContactAsset assets = 1;
}

message AssignAccountWorkEmailAssetRequest {
  string account_id = 1;
  string email = 2;
  bool is_primary = 3;
}

message AssignAccountWorkPhoneAssetRequest {
  string account_id = 1;
  string phone = 2;
  bool is_primary = 3;
}

message RevokeAccountWorkEmailAssetRequest {
  string asset_id = 1;
}

message RevokeAccountWorkPhoneAssetRequest {
  string asset_id = 1;
}

message SetAccountWorkEmailAssetStatusRequest {
  string asset_id = 1;
  bool enabled = 2;
}

message SetAccountWorkPhoneAssetStatusRequest {
  string asset_id = 1;
  bool enabled = 2;
}

message SetAccountPrimaryWorkEmailAssetRequest {
  string asset_id = 1;
}

message SetAccountPrimaryWorkPhoneAssetRequest {
  string asset_id = 1;
}

message UpdateAccountProfileRequest {
  string account_id = 1;
  string avatar_url = 2;
  string display_name = 3;
  string bio = 4;
  optional bool is_enabled = 5;
  string avatar_asset_id = 6;
}

message UpdateOwnAccountProfileRequest {
  string account_id = 1;
  string avatar_url = 2;
  string display_name = 3;
  string bio = 4;
  optional bool is_enabled = 5;
  string avatar_asset_id = 6;
}

message GetAccountsByUserIdRequest {
  string user_id = 1;
}

message AccountCandidate {
  string account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
  string scope_level = 4;
}

message GetAccountsByUserIdResponse {
  repeated AccountCandidate accounts = 1;
}

message GetAccountByIdRequest {
  string account_id = 1;
}

message AccountSummary {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string avatar_url = 4;
  string display_name = 5;
  string bio = 6;
  bool is_enabled = 7;
  string scope_level = 8;
  string avatar_asset_id = 9;
  string tenant_party_id = 10;
}

message GetAccountByIdResponse {
  AccountSummary account = 1;
}

message CreateUserAccountResponse {
  AccountSummary account = 1;
  reserved 2;
  reserved "user_party_id";
  string tenant_party_id = 3;
}

message UpdateOwnAccountProfileResponse {
  AccountSummary account = 1;
}

message UpdateAccountProfileResponse {
  AccountSummary account = 1;
}

message EmployeeBinding {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string employee_id = 4;
}

message GetEmployeeBindingByAccountIdRequest {
  string account_id = 1;
}

message GetEmployeeBindingByAccountIdResponse {
  EmployeeBinding binding = 1;
}

message ResolveEmployeeLoginAccountRequest {
  string tenant_id = 1;
  string employee_id = 2;
}

message EmployeeLoginAccount {
  string user_id = 1;
  string account_id = 2;
  string tenant_id = 3;
  string scope_level = 4;
  string display_name = 5;
  bool account_enabled = 6;
}

message ResolveEmployeeLoginAccountResponse {
  EmployeeLoginAccount account = 1;
}

message BindAccountToEmployeeResponse {
  EmployeeBinding binding = 1;
}

message UnbindAccountFromEmployeeResponse {
  EmployeeBinding binding = 1;
}

message ApiKey {
  string id = 1;
  string service_account_id = 2;
  string key_code = 3;
  string status = 4;
  string expires_at = 5;
  string last_used_at = 6;
  string created_at = 7;
  string updated_at = 8;
  string created_by = 9;
  string revoked_at = 10;
  string revoked_by = 11;
}

message ApiKeyResponse {
  ApiKey api_key = 1;
}

message RevokeApiKeyResponse {
  ApiKey api_key = 1;
}

message ApiKeyWithSecret {
  ApiKey api_key = 1;
  string secret = 2;
}

message CreateApiKeyRequest {
  string service_account_id = 1;
  string expires_at = 2;
}

message CreateApiKeyResponse {
  ApiKeyWithSecret api_key = 1;
}

message RevokeApiKeyRequest {
  string api_key_id = 1;
}

message RotateApiKeyRequest {
  string api_key_id = 1;
  string expires_at = 2;
}

message RotateApiKeyResponse {
  ApiKeyWithSecret api_key = 1;
}

message AuthenticateApiKeyRequest {
  string secret = 1;
}

message MachinePrincipalAuthentication {
  ApiKey api_key = 1;
  ServiceAccount account = 2;
}

message AuthenticateApiKeyResponse {
  MachinePrincipalAuthentication principal = 1;
}

message GetApiKeyByIdRequest {
  string api_key_id = 1;
}

message GetApiKeyByIdResponse {
  ApiKey api_key = 1;
}

message ListApiKeysByServiceAccountIdRequest {
  string service_account_id = 1;
}

message ListApiKeysByServiceAccountIdResponse {
  repeated ApiKey api_keys = 1;
}

message ServiceAccount {
  string id = 1;
  string tenant_id = 2;
  string scope_level = 3;
  string type = 4;
  string name = 5;
  string description = 6;
  string status = 7;
  string created_at = 8;
  string updated_at = 9;
  string created_by = 10;
  string disabled_at = 11;
  string disabled_by = 12;
}

message ServiceAccountResponse {
  ServiceAccount account = 1;
}

message CreateServiceAccountResponse {
  ServiceAccount account = 1;
}

message SetServiceAccountEnabledResponse {
  ServiceAccount account = 1;
}

message GetServiceAccountByIdRequest {
  string service_account_id = 1;
}

message GetServiceAccountByIdResponse {
  ServiceAccount account = 1;
}

// Auth derives this machine reference from its verified credential record; tenant, type and lifecycle are never request authority.
message ResolveIntegrationMachineForAuthRequest {
  string integration_machine_id = 1;
}

// Returns only Identity-owned machine lifecycle facts and safe decision correlation for Auth's fail-closed exchange.
message ResolveIntegrationMachineForAuthResponse {
  bool eligible = 1;
  string integration_machine_id = 2;
  string tenant_id = 3;
  string scope_level = 4;
  string machine_type = 5;
  string lifecycle_status = 6;
  string lifecycle_version = 7;
  string decision_reference = 8;
  string reason_code = 9;
}

message UpdateUserBasicInfoResponse {
  UserSummary user = 1;
}

message UpdateOwnUserBasicInfoResponse {
  UserSummary user = 1;
}

message ListServiceAccountsRequest {
  string tenant_id = 1;
  string scope_level = 2;
  string type = 3;
  string status = 4;
}

message ListServiceAccountsResponse {
  repeated ServiceAccount accounts = 1;
}

message CreateServiceAccountRequest {
  string tenant_id = 1;
  string scope_level = 2;
  string type = 3;
  string name = 4;
  string description = 5;
}

message SetServiceAccountEnabledRequest {
  string service_account_id = 1;
  bool enabled = 2;
}

// Carries Auth-verified, non-secret selectors for one Identity-owned MACHINE binding decision.
message ResolveMachinePrincipalForAuthRequest {
  string machine_principal_id = 1;
  string machine_workload_binding_id = 2;
  int64 machine_workload_binding_version = 3;
  string workload_spiffe_id = 4;
}

// Returns safe owner facts only when the requested principal, binding, version, and SPIFFE identity match exactly.
message ResolveMachinePrincipalForAuthResponse {
  bool allowed = 1;
  string machine_principal_id = 2;
  string principal_type = 3;
  string machine_type = 4;
  string scope_level = 5;
  string tenant_id = 6;
  string org_id = 7;
  string principal_lifecycle_status = 8;
  string principal_lifecycle_version = 9;
  string machine_workload_binding_id = 10;
  int64 machine_workload_binding_version = 11;
  string workload_spiffe_id = 12;
  string decision_reference = 13;
  string reason_code = 14;
}

// Enrolls one exact principal-to-SPIFFE binding under the existing protected management surface.
message EnrollMachineWorkloadBindingRequest {
  string machine_principal_id = 1;
  string workload_spiffe_id = 2;
  string idempotency_key = 3;
}

// Disables one binding only at the supplied current version.
message DisableMachineWorkloadBindingRequest {
  string machine_workload_binding_id = 1;
  int64 expected_binding_version = 2;
  string reason_code = 3;
}

// Represents the bounded lifecycle of one Identity-owned MACHINE workload binding.
message MachineWorkloadBinding {
  string binding_id = 1;
  string machine_principal_id = 2;
  string workload_spiffe_id = 3;
  string status = 4;
  int64 binding_version = 5;
  int64 created_at_unix_seconds = 6;
  int64 disabled_at_unix_seconds = 7;
  string disable_reason_code = 8;
}

message EnrollMachineWorkloadBindingResponse {
  MachineWorkloadBinding binding = 1;
  string audit_correlation_id = 2;
}

message DisableMachineWorkloadBindingResponse {
  MachineWorkloadBinding binding = 1;
  bool already_disabled = 2;
  string audit_correlation_id = 3;
}
