syntax = "proto3";

package identity_service;

option java_multiple_files = true;
option java_package = "com.oes.identity.v1";

service IdentityQueryService {
  rpc GetAccountById(GetAccountByIdRequest) returns (GetAccountByIdResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc GetApiKeyById(GetApiKeyByIdRequest) returns (GetApiKeyByIdResponse);
  rpc GetServiceAccountById(GetServiceAccountByIdRequest) returns (GetServiceAccountByIdResponse);
  rpc ListApiKeysByServiceAccountId(ListApiKeysByServiceAccountIdRequest) returns (ListApiKeysByServiceAccountIdResponse);
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc ListAccountWorkEmailAssets(ListAccountWorkEmailAssetsRequest) returns (ListAccountWorkEmailAssetsResponse);
  rpc ListAccountWorkPhoneAssets(ListAccountWorkPhoneAssetsRequest) returns (ListAccountWorkPhoneAssetsResponse);
  rpc ListAccountOrgMemberships(ListAccountOrgMembershipsRequest) returns (ListAccountOrgMembershipsResponse);
  rpc GetOrgTreeByTenantId(GetOrgTreeByTenantIdRequest) returns (GetOrgTreeByTenantIdResponse);
  rpc GetTenantById(GetTenantByIdRequest) returns (GetTenantByIdResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc GetUserByPhone(GetUserByPhoneRequest) returns (GetUserByPhoneResponse);
  rpc GetAccountsByUserId(GetAccountsByUserIdRequest) returns (GetAccountsByUserIdResponse);
}

message ListAuditEventsRequest {
  string service = 1;
  string module = 2;
  string event_type = 3;
  string result = 4;
  string operator_id = 5;
  string tenant_id = 6;
  string org_id = 7;
  string resource_type = 8;
  string resource_id = 9;
  string occurred_at_from = 10;
  string occurred_at_to = 11;
  string cursor = 12;
  int32 page_size = 13;
}

message AuditEventRecord {
  string event_id = 1;
  string service = 2;
  string module = 3;
  string event_type = 4;
  string occurred_at = 5;
  string result = 6;
  string operator_id = 7;
  string operator_type = 8;
  string tenant_id = 9;
  string org_id = 10;
  string trace_id = 11;
  string resource_type = 12;
  string resource_id = 13;
  string details_json = 14;
}

message ListAuditEventsResponse {
  repeated AuditEventRecord items = 1;
  string next_cursor = 2;
}

service IdentityManagementService {
  rpc RotateApiKey(RotateApiKeyRequest) returns (RotateApiKeyResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (ServiceAccountResponse);
  rpc CreateUserAccount(CreateUserAccountRequest) returns (GetAccountByIdResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (ApiKeyResponse);
  rpc SetServiceAccountEnabled(SetServiceAccountEnabledRequest) returns (ServiceAccountResponse);
  rpc UpdateAccountProfile(UpdateAccountProfileRequest) returns (GetAccountByIdResponse);
  rpc UpdateUserBasicInfo(UpdateUserBasicInfoRequest) returns (GetUserByIdResponse);
  rpc AssignAccountWorkEmailAsset(AssignAccountWorkEmailAssetRequest) returns (AccountContactAssetResponse);
  rpc AssignAccountWorkPhoneAsset(AssignAccountWorkPhoneAssetRequest) returns (AccountContactAssetResponse);
  rpc RevokeAccountWorkEmailAsset(RevokeAccountWorkEmailAssetRequest) returns (AccountContactAssetResponse);
  rpc RevokeAccountWorkPhoneAsset(RevokeAccountWorkPhoneAssetRequest) returns (AccountContactAssetResponse);
  rpc SetAccountWorkEmailAssetStatus(SetAccountWorkEmailAssetStatusRequest) returns (AccountContactAssetResponse);
  rpc SetAccountWorkPhoneAssetStatus(SetAccountWorkPhoneAssetStatusRequest) returns (AccountContactAssetResponse);
  rpc SetAccountPrimaryWorkEmailAsset(SetAccountPrimaryWorkEmailAssetRequest) returns (AccountContactAssetResponse);
  rpc SetAccountPrimaryWorkPhoneAsset(SetAccountPrimaryWorkPhoneAssetRequest) returns (AccountContactAssetResponse);
  rpc AddAccountOrgMembership(AddAccountOrgMembershipRequest) returns (AccountOrgMembershipResponse);
  rpc RemoveAccountOrgMembership(RemoveAccountOrgMembershipRequest) returns (AccountOrgMembershipResponse);
  rpc SetAccountPrimaryOrg(SetAccountPrimaryOrgRequest) returns (SetAccountPrimaryOrgResponse);
}

service IdentityMachineAuthService {
  rpc AuthenticateApiKey(AuthenticateApiKeyRequest) returns (AuthenticateApiKeyResponse);
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserSummary user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UserSummary {
  string id = 1;
  string username = 2;
  string personal_email = 3;
  string personal_phone = 4;
  bool is_active = 5;
}

message GetUserByEmailResponse {
  UserSummary user = 1;
}

message GetUserByPhoneRequest {
  string phone = 1;
}

message GetUserByPhoneResponse {
  UserSummary user = 1;
}

message GetTenantByIdRequest {
  string tenant_id = 1;
}

message TenantSummary {
  string id = 1;
  string code = 2;
  string name = 3;
  bool is_active = 4;
}

message GetTenantByIdResponse {
  TenantSummary tenant = 1;
}

message ListTenantsRequest {
  string keyword = 1;
  int32 page_size = 2;
  bool active_only = 3;
}

message ListTenantsResponse {
  repeated TenantSummary tenants = 1;
}

message ListAccountsRequest {
  string keyword = 1;
  string scope_level = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AccountDirectoryItem {
  string account_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string tenant_name = 4;
  string scope_level = 5;
  string display_name = 6;
  bool is_enabled = 7;
  string user_display_name = 8;
}

message ListAccountsResponse {
  repeated AccountDirectoryItem accounts = 1;
  int32 total = 2;
}

message CreateUserAccountRequest {
  string scope_level = 1;
  string tenant_id = 2;
  string display_name = 3;
  string username = 4;
  string email = 5;
  string phone = 6;
}

message UpdateUserBasicInfoRequest {
  string account_id = 1;
  string user_id = 2;
  string email = 3;
  string phone = 4;
}

message GetOrgTreeByTenantIdRequest {
  string tenant_id = 1;
}

message OrgNode {
  string id = 1;
  string tenant_id = 2;
  string parent_id = 3;
  string name = 4;
  string code = 5;
  string type = 6;
  int32 sort_order = 7;
  repeated OrgNode children = 8;
}

message GetOrgTreeByTenantIdResponse {
  repeated OrgNode roots = 1;
}

message AccountOrgMembership {
  string id = 1;
  string account_id = 2;
  string org_id = 3;
  string org_name = 4;
  string org_type = 5;
  string relation_type = 6;
  bool is_primary = 7;
}

message AccountOrgMembershipResponse {
  AccountOrgMembership membership = 1;
}

message AccountContactAsset {
  string id = 1;
  string tenant_id = 2;
  string account_id = 3;
  string type = 4;
  string value = 5;
  string status = 6;
  bool is_primary = 7;
  string assigned_at = 8;
  string revoked_at = 9;
}

message AccountContactAssetResponse {
  AccountContactAsset asset = 1;
}

message ListAccountWorkEmailAssetsRequest {
  string account_id = 1;
}

message ListAccountWorkEmailAssetsResponse {
  repeated AccountContactAsset assets = 1;
}

message ListAccountWorkPhoneAssetsRequest {
  string account_id = 1;
}

message ListAccountWorkPhoneAssetsResponse {
  repeated AccountContactAsset assets = 1;
}

message AssignAccountWorkEmailAssetRequest {
  string account_id = 1;
  string email = 2;
  bool is_primary = 3;
}

message AssignAccountWorkPhoneAssetRequest {
  string account_id = 1;
  string phone = 2;
  bool is_primary = 3;
}

message RevokeAccountWorkEmailAssetRequest {
  string asset_id = 1;
}

message RevokeAccountWorkPhoneAssetRequest {
  string asset_id = 1;
}

message SetAccountWorkEmailAssetStatusRequest {
  string asset_id = 1;
  bool enabled = 2;
}

message SetAccountWorkPhoneAssetStatusRequest {
  string asset_id = 1;
  bool enabled = 2;
}

message SetAccountPrimaryWorkEmailAssetRequest {
  string asset_id = 1;
}

message SetAccountPrimaryWorkPhoneAssetRequest {
  string asset_id = 1;
}

message AddAccountOrgMembershipRequest {
  string account_id = 1;
  string org_id = 2;
}

message RemoveAccountOrgMembershipRequest {
  string account_id = 1;
  string org_id = 2;
}

message SetAccountPrimaryOrgRequest {
  string account_id = 1;
  string org_id = 2;
}

message SetAccountPrimaryOrgResponse {
  AccountOrgMembership membership = 1;
}

message UpdateAccountProfileRequest {
  string account_id = 1;
  string avatar_url = 2;
  string display_name = 3;
  string bio = 4;
  optional bool is_enabled = 5;
}

message ListAccountOrgMembershipsRequest {
  string account_id = 1;
}

message ListAccountOrgMembershipsResponse {
  repeated AccountOrgMembership memberships = 1;
}

message GetAccountsByUserIdRequest {
  string user_id = 1;
}

message AccountCandidate {
  string account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
  string scope_level = 4;
  string tenant_name = 5;
}

message GetAccountsByUserIdResponse {
  repeated AccountCandidate accounts = 1;
}

message GetAccountByIdRequest {
  string account_id = 1;
}

message AccountSummary {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string avatar_url = 4;
  string display_name = 5;
  string bio = 6;
  bool is_enabled = 7;
  string scope_level = 8;
}

message GetAccountByIdResponse {
  AccountSummary account = 1;
}

message ApiKey {
  string id = 1;
  string service_account_id = 2;
  string key_code = 3;
  string status = 4;
  string expires_at = 5;
  string last_used_at = 6;
  string created_at = 7;
  string updated_at = 8;
  string created_by = 9;
  string revoked_at = 10;
  string revoked_by = 11;
}

message ApiKeyResponse {
  ApiKey api_key = 1;
}

message ApiKeyWithSecret {
  ApiKey api_key = 1;
  string secret = 2;
}

message CreateApiKeyRequest {
  string service_account_id = 1;
  string expires_at = 2;
}

message CreateApiKeyResponse {
  ApiKeyWithSecret api_key = 1;
}

message RevokeApiKeyRequest {
  string api_key_id = 1;
}

message RotateApiKeyRequest {
  string api_key_id = 1;
  string expires_at = 2;
}

message RotateApiKeyResponse {
  ApiKeyWithSecret api_key = 1;
}

message AuthenticateApiKeyRequest {
  string secret = 1;
}

message MachinePrincipalAuthentication {
  ApiKey api_key = 1;
  ServiceAccount account = 2;
}

message AuthenticateApiKeyResponse {
  MachinePrincipalAuthentication principal = 1;
}

message GetApiKeyByIdRequest {
  string api_key_id = 1;
}

message GetApiKeyByIdResponse {
  ApiKey api_key = 1;
}

message ListApiKeysByServiceAccountIdRequest {
  string service_account_id = 1;
}

message ListApiKeysByServiceAccountIdResponse {
  repeated ApiKey api_keys = 1;
}

message ServiceAccount {
  string id = 1;
  string tenant_id = 2;
  string scope_level = 3;
  string type = 4;
  string name = 5;
  string description = 6;
  string status = 7;
  string created_at = 8;
  string updated_at = 9;
  string created_by = 10;
  string disabled_at = 11;
  string disabled_by = 12;
}

message ServiceAccountResponse {
  ServiceAccount account = 1;
}

message GetServiceAccountByIdRequest {
  string service_account_id = 1;
}

message GetServiceAccountByIdResponse {
  ServiceAccount account = 1;
}

message ListServiceAccountsRequest {
  string tenant_id = 1;
  string scope_level = 2;
  string type = 3;
  string status = 4;
}

message ListServiceAccountsResponse {
  repeated ServiceAccount accounts = 1;
}

message CreateServiceAccountRequest {
  string tenant_id = 1;
  string scope_level = 2;
  string type = 3;
  string name = 4;
  string description = 5;
}

message SetServiceAccountEnabledRequest {
  string service_account_id = 1;
  bool enabled = 2;
}
