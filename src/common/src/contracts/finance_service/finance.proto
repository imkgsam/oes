  string quote_currency_code = 4;
  string rate_value = 5;
  string effective_at = 6;
  string set_by = 7;
  string updated_at = 8;
}

message ReceivableScheduleLine {
  string receivable_schedule_line_id = 1;
  uint32 line_no = 2;
  string due_date = 3;
  string scheduled_amount = 4;
