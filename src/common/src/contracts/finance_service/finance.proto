  string sales_order_id = 3;
  string customer_tenant_party_id = 4;
  FinanceReleaseSignalStatus signal_status = 5;
  string reason_code = 6;
  string reason_summary = 7;
  string effective_at = 8;
  string expires_at = 9;
  string based_on_summary = 10;
  string updated_at = 11;
}

message PaymentAllocation {
  string payment_allocation_id = 1;
  string account_transaction_id = 2;
  string payment_execution_id = 3;
  string target_type = 4;
  string target_schedule_id = 5;
  string target_schedule_line_id = 6;
  string allocated_amount = 7;
  string currency_code = 8;
  string allocated_at = 9;
  string payment_request_id = 10;
}

message PayableScheduleLine {
  string payable_schedule_line_id = 1;
  uint32 line_no = 2;
  string line_type = 3;
  string source_ref = 4;
  string due_date = 5;
  string scheduled_amount = 6;
  string requested_amount = 7;
  string executed_amount = 8;
  string allocated_amount = 9;
  string outstanding_amount = 10;
  string status = 11;
  string request_governance_status = 12;
  string source_purchase_order_line_id = 13;
  string supersedes_source_ref = 14;
  string memo = 15;
}

message PayableSchedule {
  string payable_schedule_id = 1;
  string schedule_no = 2;
  string tenant_id = 3;
  string org_id = 4;
  string source_type = 5;
  string source_purchase_order_id = 6;
  string source_purchase_order_no = 7;
  string procurement_snapshot_reference = 8;
  string supplier_tenant_party_id = 9;
  string supplier_snapshot = 10;
  string currency_code = 11;
  string status = 12;
  string total_scheduled_amount = 13;
  string total_requested_amount = 14;
  string total_executed_amount = 15;
  string total_allocated_amount = 16;
  string outstanding_amount = 17;
  repeated PayableScheduleLine lines = 18;
  string created_at = 19;
  string updated_at = 20;
}

message PayableScheduleSummary {
  string payable_schedule_id = 1;
  string schedule_no = 2;
  string source_purchase_order_id = 3;
  string source_purchase_order_no = 4;
  string supplier_tenant_party_id = 5;
  string supplier_display_name = 6;
  string currency_code = 7;
  string status = 8;
  string request_governance_status_summary = 9;
  string outstanding_amount = 10;
  string nearest_due_date = 11;
}

message PaymentRequestLine {
  string payment_request_line_id = 1;
  string payable_schedule_id = 2;
  string payable_schedule_line_id = 3;
  string schedule_due_date = 4;
  string requested_amount = 5;
  bool is_early_request = 6;
  string line_status = 7;
}

message SupplierBillEvidenceSnapshot {
  string evidence_snapshot_id = 1;
  string evidence_type = 2;
  string external_document_no = 3;
  string document_date = 4;
  string currency_code = 5;
  string document_amount = 6;
  string attachment_ref = 7;
  string note = 8;
  string captured_at = 9;
}

message PaymentRequest {
  string payment_request_id = 1;
  string request_no = 2;
  string tenant_id = 3;
  string org_id = 4;
  string request_source = 5;
  string source_purchase_order_id = 6;
  string supplier_tenant_party_id = 7;
  string beneficiary_supplier_financial_account_id = 8;
  string currency_code = 9;
  string requested_amount = 10;
  string status = 11;
  string reason = 12;
  repeated PaymentRequestLine lines = 13;
  repeated SupplierBillEvidenceSnapshot evidence_snapshots = 14;
  string requested_at = 15;
  string updated_at = 16;
}

message PaymentRequestSummary {
  string payment_request_id = 1;
  string request_no = 2;
  string request_source = 3;
  string supplier_tenant_party_id = 4;
  string supplier_display_name = 5;
  string currency_code = 6;
  string requested_amount = 7;
