message PaymentExecutionSummary {
  string payment_execution_id = 1;
  string payment_request_id = 2;
  string supplier_tenant_party_id = 3;
  string executed_amount = 4;
  string currency_code = 5;
  string status = 6;
  string executed_at = 7;
}

message CreateFinancialAccountRequest {
  reserved 1, 2, 3, 4, 5;
  reserved "tenant_id", "operator_context", "trace_context", "audit_context", "org_id";
