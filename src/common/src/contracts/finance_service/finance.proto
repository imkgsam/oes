syntax = "proto3";

package finance_service;

option java_multiple_files = true;
option java_package = "com.oes.finance.v1";

service FinancialAccountQueryService {
  rpc GetFinancialAccount(GetFinancialAccountRequest) returns (GetFinancialAccountResponse);
  rpc SearchFinancialAccounts(SearchFinancialAccountsRequest) returns (SearchFinancialAccountsResponse);
  rpc SearchAccountTransactions(SearchAccountTransactionsRequest) returns (SearchAccountTransactionsResponse);
  rpc GetExchangeRate(GetExchangeRateRequest) returns (GetExchangeRateResponse);
}

service FinancialAccountManagementService {
  rpc CreateFinancialAccount(CreateFinancialAccountRequest) returns (CreateFinancialAccountResponse);
  rpc UpdateFinancialAccountBasics(UpdateFinancialAccountBasicsRequest) returns (UpdateFinancialAccountBasicsResponse);
  rpc ImportAccountTransactions(ImportAccountTransactionsRequest) returns (ImportAccountTransactionsResponse);
  rpc RecordAccountTransaction(RecordAccountTransactionRequest) returns (RecordAccountTransactionResponse);
  rpc RegisterCustomerFinancialAccount(RegisterCustomerFinancialAccountRequest) returns (RegisterCustomerFinancialAccountResponse);
  rpc SetExchangeRate(SetExchangeRateRequest) returns (SetExchangeRateResponse);
}

service ReceivableQueryService {
  rpc GetReceivableSchedule(GetReceivableScheduleRequest) returns (GetReceivableScheduleResponse);
  rpc SearchReceivableSchedules(SearchReceivableSchedulesRequest) returns (SearchReceivableSchedulesResponse);
  rpc GetFinanceReleaseSignal(GetFinanceReleaseSignalRequest) returns (GetFinanceReleaseSignalResponse);
}

service ReceivableManagementService {
  rpc CreateReceivableScheduleFromSalesOrder(CreateReceivableScheduleFromSalesOrderRequest) returns (CreateReceivableScheduleFromSalesOrderResponse);
  rpc SetFinanceReleaseSignal(SetFinanceReleaseSignalRequest) returns (SetFinanceReleaseSignalResponse);
}

service PaymentQueryService {
  rpc GetPayableSchedule(GetPayableScheduleRequest) returns (GetPayableScheduleResponse);
  rpc SearchPayableSchedules(SearchPayableSchedulesRequest) returns (SearchPayableSchedulesResponse);
  rpc SearchPaymentRequests(SearchPaymentRequestsRequest) returns (SearchPaymentRequestsResponse);
  rpc SearchPaymentExecutions(SearchPaymentExecutionsRequest) returns (SearchPaymentExecutionsResponse);
  rpc SearchPaymentAllocations(SearchPaymentAllocationsRequest) returns (SearchPaymentAllocationsResponse);
}

service PaymentManagementService {
  rpc CreatePayableScheduleFromPurchaseOrder(CreatePayableScheduleFromPurchaseOrderRequest) returns (CreatePayableScheduleFromPurchaseOrderResponse);
  rpc ApplyPayableScheduleAdjustmentFromPurchaseOrderChange(ApplyPayableScheduleAdjustmentFromPurchaseOrderChangeRequest) returns (ApplyPayableScheduleAdjustmentFromPurchaseOrderChangeResponse);
  rpc CreatePaymentRequest(CreatePaymentRequestRequest) returns (CreatePaymentRequestResponse);
  rpc DecidePaymentRequest(DecidePaymentRequestRequest) returns (DecidePaymentRequestResponse);
  rpc ExecutePaymentRequest(ExecutePaymentRequestRequest) returns (ExecutePaymentRequestResponse);
  rpc AllocatePaymentToPayable(AllocatePaymentToPayableRequest) returns (AllocatePaymentToPayableResponse);
  rpc AllocatePaymentToReceivable(AllocatePaymentToReceivableRequest) returns (AllocatePaymentToReceivableResponse);
}

enum FinancialAccountType {
  FINANCIAL_ACCOUNT_TYPE_UNSPECIFIED = 0;
  FINANCIAL_ACCOUNT_TYPE_BANK = 1;
  FINANCIAL_ACCOUNT_TYPE_CASH = 2;
  FINANCIAL_ACCOUNT_TYPE_WECHAT = 3;
  FINANCIAL_ACCOUNT_TYPE_ALIPAY = 4;
  FINANCIAL_ACCOUNT_TYPE_PAYPAL = 5;
  FINANCIAL_ACCOUNT_TYPE_STRIPE = 6;
  FINANCIAL_ACCOUNT_TYPE_OTHER_PSP = 7;
}

enum FinancialAccountStatus {
  FINANCIAL_ACCOUNT_STATUS_UNSPECIFIED = 0;
  FINANCIAL_ACCOUNT_STATUS_ACTIVE = 1;
  FINANCIAL_ACCOUNT_STATUS_INACTIVE = 2;
  FINANCIAL_ACCOUNT_STATUS_CLOSED = 3;
}

enum AccountTransactionDirection {
  ACCOUNT_TRANSACTION_DIRECTION_UNSPECIFIED = 0;
  ACCOUNT_TRANSACTION_DIRECTION_INFLOW = 1;
  ACCOUNT_TRANSACTION_DIRECTION_OUTFLOW = 2;
}

enum AccountTransactionSourceType {
  ACCOUNT_TRANSACTION_SOURCE_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TRANSACTION_SOURCE_TYPE_MANUAL = 1;
  ACCOUNT_TRANSACTION_SOURCE_TYPE_CSV_IMPORT = 2;
  ACCOUNT_TRANSACTION_SOURCE_TYPE_FUTURE_API = 3;
}

enum AccountTransactionStatus {
  ACCOUNT_TRANSACTION_STATUS_UNSPECIFIED = 0;
  ACCOUNT_TRANSACTION_STATUS_DRAFT = 1;
  ACCOUNT_TRANSACTION_STATUS_CONFIRMED = 2;
  ACCOUNT_TRANSACTION_STATUS_VOIDED = 3;
}

enum AccountTransactionAllocationStatus {
  ACCOUNT_TRANSACTION_ALLOCATION_STATUS_UNSPECIFIED = 0;
  ACCOUNT_TRANSACTION_ALLOCATION_STATUS_UNALLOCATED = 1;
  ACCOUNT_TRANSACTION_ALLOCATION_STATUS_PARTIALLY_ALLOCATED = 2;
  ACCOUNT_TRANSACTION_ALLOCATION_STATUS_FULLY_ALLOCATED = 3;
}

enum CustomerFinancialAccountProviderType {
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_UNSPECIFIED = 0;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_BANK = 1;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_WECHAT = 2;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_ALIPAY = 3;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_PAYPAL = 4;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_STRIPE = 5;
  CUSTOMER_FINANCIAL_ACCOUNT_PROVIDER_TYPE_OTHER = 6;
}

enum CustomerFinancialAccountVerifiedStatus {
  CUSTOMER_FINANCIAL_ACCOUNT_VERIFIED_STATUS_UNSPECIFIED = 0;
  CUSTOMER_FINANCIAL_ACCOUNT_VERIFIED_STATUS_UNVERIFIED = 1;
  CUSTOMER_FINANCIAL_ACCOUNT_VERIFIED_STATUS_VERIFIED = 2;
}

enum ReceivableScheduleStatus {
  RECEIVABLE_SCHEDULE_STATUS_UNSPECIFIED = 0;
  RECEIVABLE_SCHEDULE_STATUS_OPEN = 1;
  RECEIVABLE_SCHEDULE_STATUS_PARTIALLY_PAID = 2;
  RECEIVABLE_SCHEDULE_STATUS_PAID = 3;
  RECEIVABLE_SCHEDULE_STATUS_CANCELLED = 4;
  RECEIVABLE_SCHEDULE_STATUS_ON_HOLD = 5;
}

enum ReceivableScheduleLineStatus {
  RECEIVABLE_SCHEDULE_LINE_STATUS_UNSPECIFIED = 0;
  RECEIVABLE_SCHEDULE_LINE_STATUS_OPEN = 1;
  RECEIVABLE_SCHEDULE_LINE_STATUS_PARTIALLY_PAID = 2;
  RECEIVABLE_SCHEDULE_LINE_STATUS_PAID = 3;
  RECEIVABLE_SCHEDULE_LINE_STATUS_CANCELLED = 4;
  RECEIVABLE_SCHEDULE_LINE_STATUS_OVERDUE = 5;
}

enum FinanceReleaseSignalStatus {
  FINANCE_RELEASE_SIGNAL_STATUS_UNSPECIFIED = 0;
  FINANCE_RELEASE_SIGNAL_STATUS_RELEASED = 1;
  FINANCE_RELEASE_SIGNAL_STATUS_HELD = 2;
  FINANCE_RELEASE_SIGNAL_STATUS_REVIEW_REQUIRED = 3;
}

message OperatorContext {
  reserved 1, 2, 3;
  reserved "operator_id", "operator_type", "org_id";
}

message TraceContext {
  reserved 1, 2;
  reserved "trace_id", "request_id";
}

message AuditContext {
  reserved 1, 2, 3;
  reserved "audit_id", "reason", "source";
}

message FinancialAccount {
  string financial_account_id = 1;
  string account_no = 2;
  string tenant_id = 3;
  string org_id = 4;
  FinancialAccountType account_type = 5;
  string account_name = 6;
  string currency_code = 7;
  string institution_name = 8;
  string account_identifier_masked = 9;
  FinancialAccountStatus status = 10;
  string last_transaction_at = 11;
  string current_balance = 12;
  string created_at = 13;
  string updated_at = 14;
}

message FinancialAccountSummary {
  string financial_account_id = 1;
  string account_no = 2;
  FinancialAccountType account_type = 3;
  string account_name = 4;
  string currency_code = 5;
  FinancialAccountStatus status = 6;
  string last_transaction_at = 7;
  string current_balance = 8;
}

message AccountTransaction {
  string account_transaction_id = 1;
  string financial_account_id = 2;
  AccountTransactionDirection direction = 3;
  string amount = 4;
  string currency_code = 5;
  string transaction_time = 6;
  string value_date = 7;
  AccountTransactionSourceType source_type = 8;
  AccountTransactionStatus status = 9;
  string external_reference = 10;
  string counterparty_name = 11;
  string counterparty_account_snapshot = 12;
  string memo = 13;
  string payment_execution_id = 14;
  AccountTransactionAllocationStatus allocation_status = 15;
  string allocated_amount = 16;
  string unallocated_amount = 17;
  string file_asset_id = 18;
  string attachment_ref = 19;
  string created_at = 20;
}

message ImportBatchSummary {
