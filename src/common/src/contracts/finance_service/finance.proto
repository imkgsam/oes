  string source_type = 2;
  string source_batch_reference = 3;
  string file_asset_id = 4;
  string attachment_ref = 5;
  uint32 total_rows = 6;
  uint32 accepted_count = 7;
  uint32 duplicate_count = 8;
  uint32 failed_count = 9;
}

message CustomerFinancialAccount {
  string customer_financial_account_id = 1;
  string customer_tenant_party_id = 2;
  string account_holder_name = 3;
  CustomerFinancialAccountProviderType account_provider_type = 4;
  string account_identifier_masked = 5;
  string currency_code = 6;
