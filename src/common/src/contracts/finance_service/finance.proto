  string source_sales_order_id = 5;
  string customer_tenant_party_id = 6;
  string customer_snapshot = 7;
  string currency_code = 8;
  ReceivableScheduleStatus status = 9;
  string total_scheduled_amount = 10;
  string total_allocated_amount = 11;
  string outstanding_amount = 12;
  repeated ReceivableScheduleLine lines = 13;
  string sales_exchange_rate_snapshot = 14;
