syntax = "proto3";

package auth_service;

option java_multiple_files = true;
option java_package = "com.oes.auth.v1";

// Manages the short-lived, certificate-bound root credential used only by first-party MACHINE workloads.
service MachineWorkloadSourceCredentialService {
  // Issues or controlled-reissues one credential after Auth verifies the caller's mTLS-bound Identity binding.
  rpc IssueMachineWorkloadSourceCredential(IssueMachineWorkloadSourceCredentialRequest) returns (IssueMachineWorkloadSourceCredentialResponse);
  // Revokes one credential through the normal protected management path.
  rpc RevokeMachineWorkloadSourceCredential(RevokeMachineWorkloadSourceCredentialRequest) returns (RevokeMachineWorkloadSourceCredentialResponse);
}

// Carries only non-secret Identity selectors; current SPIFFE and leaf evidence stay transport-private.
message IssueMachineWorkloadSourceCredentialRequest {
  string machine_principal_id = 1;
  string machine_workload_binding_id = 2;
  int64 machine_workload_binding_version = 3;
}

// Returns one no-refresh source credential and its bounded lifecycle correlation facts.
message IssueMachineWorkloadSourceCredentialResponse {
  string source_credential = 1;
  string credential_id = 2;
  string token_type = 3;
  int64 issued_at_unix_seconds = 4;
  int64 expires_at_unix_seconds = 5;
  string machine_principal_id = 6;
  string machine_workload_binding_id = 7;
  int64 machine_workload_binding_version = 8;
  string audit_correlation_id = 9;
  string supersedes_credential_id = 10;
}

// Selects one credential and an allowlisted revocation reason under a protected management identity.
message RevokeMachineWorkloadSourceCredentialRequest {
  string credential_id = 1;
  string reason_code = 2;
}

// Returns the immutable first-revocation fact, including idempotent retries.
message RevokeMachineWorkloadSourceCredentialResponse {
  string credential_id = 1;
  string status = 2;
  int64 revoked_at_unix_seconds = 3;
  bool already_revoked = 4;
  string audit_correlation_id = 5;
}
