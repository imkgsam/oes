syntax = "proto3";

package auth_service;

option java_multiple_files = true;
option java_package = "com.oes.auth.v1";

service AuthService {
  rpc LoginWithEmailPassword(EmailPasswordLoginRequest) returns (LoginResponse);
  rpc SubmitMfaChallenge(SubmitMfaChallengeRequest) returns (LoginResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc SelectAccount(SelectAccountRequest) returns (SelectAccountResponse);
}

message EmailPasswordLoginRequest {
  string email = 1;
  string password = 2;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_SUCCESS = 1;
  LOGIN_STATUS_MFA_REQUIRED = 2;
  LOGIN_STATUS_ACCOUNT_SELECTION_REQUIRED = 3;
  LOGIN_STATUS_DENIED = 4;
}

message AccountCandidate {
  string account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
}

message SelectAccountRequest {
  string user_id = 1;
  string account_id = 2;
}

message SubmitMfaChallengeRequest {
  string challenge_id = 1;
  string code = 2;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message SelectAccountResponse {
  LoginStatus status = 1;
  string user_id = 2;
  string account_id = 3;
  string tenant_id = 4;
  string display_name = 5;
  string session_id = 6;
  string access_token = 7;
  string refresh_token = 8;
  int64 expires_in = 9;
  string next_step = 10;
}

message LoginResponse {
  LoginStatus status = 1;
  string user_id = 2;
  string challenge_id = 3;
  string access_token = 4;
  string refresh_token = 5;
  int64 expires_in = 6;
  repeated AccountCandidate accounts = 7;
}
