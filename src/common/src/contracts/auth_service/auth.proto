syntax = "proto3";

package auth_service;

option java_multiple_files = true;
option java_package = "com.oes.auth.v1";

service AuthService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListLoginHistory(ListLoginHistoryRequest) returns (ListLoginHistoryResponse);
  rpc BootstrapOwnLoginMethods(BootstrapOwnLoginMethodsRequest) returns (BootstrapOwnLoginMethodsResponse);
  rpc BootstrapUserLoginMethods(BootstrapUserLoginMethodsRequest) returns (BootstrapUserLoginMethodsResponse);
  rpc CompleteFirstLoginPasswordSetup(CompleteFirstLoginPasswordSetupRequest) returns (CompleteFirstLoginPasswordSetupResponse);
  rpc LoginWithEmailPassword(LoginWithEmailPasswordRequest) returns (LoginWithEmailPasswordResponse);
  rpc RequestEmailOtpLoginChallenge(RequestEmailOtpLoginChallengeRequest) returns (RequestEmailOtpLoginChallengeResponse);
  rpc RequestEmailBindingChallenge(RequestEmailBindingChallengeRequest) returns (RequestEmailBindingChallengeResponse);
  rpc LoginWithEmailOtp(LoginWithEmailOtpRequest) returns (LoginWithEmailOtpResponse);
  rpc LoginWithEmployeeCodePin(LoginWithEmployeeCodePinRequest) returns (LoginWithEmployeeCodePinResponse);
  rpc PreflightEmployeeCodePinLogin(PreflightEmployeeCodePinLoginRequest) returns (PreflightEmployeeCodePinLoginResponse);
  rpc LoginWithPhonePassword(LoginWithPhonePasswordRequest) returns (LoginWithPhonePasswordResponse);
  rpc RequestPhoneOtpLoginChallenge(RequestPhoneOtpLoginChallengeRequest) returns (RequestPhoneOtpLoginChallengeResponse);
  rpc RequestPhoneBindingChallenge(RequestPhoneBindingChallengeRequest) returns (RequestPhoneBindingChallengeResponse);
  rpc LoginWithPhoneOtp(LoginWithPhoneOtpRequest) returns (LoginWithPhoneOtpResponse);
  rpc InspectPasswordRecoveryChannels(InspectPasswordRecoveryChannelsRequest) returns (InspectPasswordRecoveryChannelsResponse);
  rpc RequestPasswordRecoveryChallenge(RequestPasswordRecoveryChallengeRequest) returns (RequestPasswordRecoveryChallengeResponse);
  rpc VerifyPasswordRecoveryChallenge(VerifyPasswordRecoveryChallengeRequest) returns (VerifyPasswordRecoveryChallengeResponse);
  rpc CompletePasswordRecovery(CompletePasswordRecoveryRequest) returns (CompletePasswordRecoveryResponse);
  rpc ListLoginMethods(ListLoginMethodsRequest) returns (ListLoginMethodsResponse);
  rpc ChangeOwnPassword(ChangeOwnPasswordRequest) returns (ChangeOwnPasswordResponse);
  rpc SetOwnTerminalPin(SetOwnTerminalPinRequest) returns (SetOwnTerminalPinResponse);
  rpc ResetOwnTerminalPin(ResetOwnTerminalPinRequest) returns (ResetOwnTerminalPinResponse);
  rpc SetOwnTerminalPinEnabled(SetOwnTerminalPinEnabledRequest) returns (SetOwnTerminalPinEnabledResponse);
  rpc SetOwnLoginMethodEnabled(SetOwnLoginMethodEnabledRequest) returns (SetOwnLoginMethodEnabledResponse);
  rpc VerifyEmailBinding(VerifyEmailBindingRequest) returns (VerifyEmailBindingResponse);
  rpc VerifyPhoneBinding(VerifyPhoneBindingRequest) returns (VerifyPhoneBindingResponse);
  rpc RequirePasswordSetup(RequirePasswordSetupRequest) returns (RequirePasswordSetupResponse);
  rpc RequireTerminalPinReset(RequireTerminalPinResetRequest) returns (RequireTerminalPinResetResponse);
  rpc DisableUserTerminalPin(DisableUserTerminalPinRequest) returns (DisableUserTerminalPinResponse);
  rpc SetLoginMethodEnabled(SetLoginMethodEnabledRequest) returns (SetLoginMethodEnabledResponse);
  rpc ListMfaBindings(ListMfaBindingsRequest) returns (ListMfaBindingsResponse);
  rpc EnableMfaBinding(EnableMfaBindingRequest) returns (EnableMfaBindingResponse);
  rpc DisableMfaBinding(DisableMfaBindingRequest) returns (DisableMfaBindingResponse);
  rpc InitializeTotpBinding(InitializeTotpBindingRequest) returns (InitializeTotpBindingResponse);
  rpc ActivateTotpBinding(ActivateTotpBindingRequest) returns (ActivateTotpBindingResponse);
  rpc InitializeRecoveryCodes(InitializeRecoveryCodesRequest) returns (InitializeRecoveryCodesResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);
  rpc RequestLoginMfaFactorChallenge(RequestLoginMfaFactorChallengeRequest) returns (RequestLoginMfaFactorChallengeResponse);
  rpc SubmitMfaChallenge(SubmitMfaChallengeRequest) returns (SubmitMfaChallengeResponse);
  rpc StartStepUpMfaChallenge(StartStepUpMfaChallengeRequest) returns (StartStepUpMfaChallengeResponse);
  rpc CompleteStepUpMfaChallenge(CompleteStepUpMfaChallengeRequest) returns (CompleteStepUpMfaChallengeResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc ValidateAccessToken(ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
  rpc SelectAccount(SelectAccountRequest) returns (SelectAccountResponse);
  rpc GetTenantMfaPolicy(GetTenantMfaPolicyRequest) returns (GetTenantMfaPolicyResponse);
  rpc UpdateTenantMfaPolicy(UpdateTenantMfaPolicyRequest) returns (UpdateTenantMfaPolicyResponse);
  rpc GetPlatformMfaPolicy(GetPlatformMfaPolicyRequest) returns (GetPlatformMfaPolicyResponse);
  rpc UpdatePlatformMfaPolicy(UpdatePlatformMfaPolicyRequest) returns (UpdatePlatformMfaPolicyResponse);
  rpc GetPlatformTerminalLoginPolicy(GetPlatformTerminalLoginPolicyRequest) returns (GetPlatformTerminalLoginPolicyResponse);
  rpc UpdatePlatformTerminalLoginPolicy(UpdatePlatformTerminalLoginPolicyRequest) returns (UpdatePlatformTerminalLoginPolicyResponse);
  rpc GetPlatformDefaultTerminalMfaPolicy(GetPlatformDefaultTerminalMfaPolicyRequest) returns (GetPlatformDefaultTerminalMfaPolicyResponse);
  rpc UpdatePlatformDefaultTerminalMfaPolicy(UpdatePlatformDefaultTerminalMfaPolicyRequest) returns (UpdatePlatformDefaultTerminalMfaPolicyResponse);
  rpc GetTenantTerminalMfaPolicy(GetTenantTerminalMfaPolicyRequest) returns (GetTenantTerminalMfaPolicyResponse);
  rpc UpdateTenantTerminalMfaPolicy(UpdateTenantTerminalMfaPolicyRequest) returns (UpdateTenantTerminalMfaPolicyResponse);
  rpc HandleTerminalDeviceUnavailable(HandleTerminalDeviceUnavailableRequest) returns (HandleTerminalDeviceUnavailableResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListTrustedDevices(ListTrustedDevicesRequest) returns (ListTrustedDevicesResponse);
  rpc RevokeTrustedDevice(RevokeTrustedDeviceRequest) returns (RevokeTrustedDeviceResponse);
  rpc RevokeOtherTrustedDevices(RevokeOtherTrustedDevicesRequest) returns (RevokeOtherTrustedDevicesResponse);
  rpc AdminListOnlineUsers(AdminListOnlineUsersRequest) returns (AdminListOnlineUsersResponse);
  rpc AdminListUserSessions(AdminListUserSessionsRequest) returns (AdminListUserSessionsResponse);
  rpc AdminListTerminalDeviceSessions(AdminListTerminalDeviceSessionsRequest) returns (AdminListTerminalDeviceSessionsResponse);
  rpc AdminRevokeSession(AdminRevokeSessionRequest) returns (AdminRevokeSessionResponse);
  rpc AdminDeleteAccountSessions(AdminDeleteAccountSessionsRequest) returns (AdminDeleteAccountSessionsResponse);
  rpc RevokeTenantSessions(RevokeTenantSessionsRequest) returns (RevokeTenantSessionsResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutSession(LogoutSessionRequest) returns (LogoutSessionResponse);
  rpc LogoutOtherDevices(LogoutOtherDevicesRequest) returns (LogoutOtherDevicesResponse);
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
}

