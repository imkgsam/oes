syntax = "proto3";

package auth_service;

option java_multiple_files = true;
option java_package = "com.oes.auth.v1";

service AuthService {
  rpc LoginWithEmailPassword(EmailPasswordLoginRequest) returns (LoginResponse);
  rpc RequestEmailOtpLoginChallenge(EmailOtpChallengeRequest) returns (OtpChallengeResponse);
  rpc LoginWithEmailOtp(EmailOtpLoginRequest) returns (LoginResponse);
  rpc LoginWithPhonePassword(PhonePasswordLoginRequest) returns (LoginResponse);
  rpc RequestPhoneOtpLoginChallenge(PhoneOtpChallengeRequest) returns (OtpChallengeResponse);
  rpc LoginWithPhoneOtp(PhoneOtpLoginRequest) returns (LoginResponse);
  rpc SubmitMfaChallenge(SubmitMfaChallengeRequest) returns (LoginResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc SelectAccount(SelectAccountRequest) returns (SelectAccountResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc AdminListUserSessions(AdminListUserSessionsRequest) returns (AdminListUserSessionsResponse);
  rpc AdminRevokeSession(AdminRevokeSessionRequest) returns (AdminRevokeSessionResponse);
  rpc RenameSessionDevice(RenameSessionDeviceRequest) returns (RenameSessionDeviceResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutOtherDevices(LogoutOtherDevicesRequest) returns (LogoutOtherDevicesResponse);
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
}

message EmailPasswordLoginRequest {
  string email = 1;
  string password = 2;
}

message EmailOtpChallengeRequest {
  string email = 1;
}

message EmailOtpLoginRequest {
  string email = 1;
  string otp = 2;
}

message PhonePasswordLoginRequest {
  string phone = 1;
  string password = 2;
}

message PhoneOtpChallengeRequest {
  string phone = 1;
}

message OtpChallengeResponse {
  string challenge_id = 1;
  string expires_at = 2;
  string destination = 3;
}

message PhoneOtpLoginRequest {
  string phone = 1;
  string otp = 2;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_SUCCESS = 1;
  LOGIN_STATUS_MFA_REQUIRED = 2;
  LOGIN_STATUS_ACCOUNT_SELECTION_REQUIRED = 3;
  LOGIN_STATUS_DENIED = 4;
}

message AccountCandidate {
  string account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
}

message SelectAccountRequest {
  string user_id = 1;
  string account_id = 2;
  string login_method = 3;
}

message SubmitMfaChallengeRequest {
  string challenge_id = 1;
  string code = 2;
  string login_method = 3;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message ListSessionsRequest {
  string user_id = 1;
  string current_session_id = 2;
}

message SessionView {
  string session_id = 1;
  string user_id = 2;
  string account_id = 3;
  string tenant_id = 4;
  string status = 5;
  string device_id = 6;
  string device_name = 7;
  string user_agent = 8;
  string ip_address = 9;
  string created_at = 10;
  string last_active_at = 11;
  string expires_at = 12;
  string refresh_expires_at = 13;
  bool is_current = 14;
  bool is_admin_controlled = 15;
}

message ListSessionsResponse {
  repeated SessionView sessions = 1;
}

message AdminListUserSessionsRequest {
  string user_id = 1;
}

message AdminSessionView {
  string session_id = 1;
  string user_id = 2;
  string account_id = 3;
  string tenant_id = 4;
  string status = 5;
  string device_id = 6;
  string device_name = 7;
  string user_agent = 8;
  string ip_address = 9;
  string created_at = 10;
  string last_active_at = 11;
  string expires_at = 12;
  string refresh_expires_at = 13;
  bool is_admin_controlled = 14;
  string admin_revoke_reason = 15;
  string admin_revoke_at = 16;
  string admin_revoke_by = 17;
}

message AdminListUserSessionsResponse {
  repeated AdminSessionView sessions = 1;
}

message AdminRevokeSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message AdminRevokeSessionResponse {
  bool success = 1;
  string session_id = 2;
}

message RenameSessionDeviceRequest {
  string user_id = 1;
  string session_id = 2;
  string device_name = 3;
}

message RenameSessionDeviceResponse {
  bool success = 1;
  string session_id = 2;
  string device_name = 3;
}

message LogoutRequest {
  string session_id = 1;
}

message LogoutResponse {
  bool success = 1;
}

message LogoutOtherDevicesRequest {
  string user_id = 1;
  string current_session_id = 2;
}

message LogoutOtherDevicesResponse {
  bool success = 1;
  int64 session_count = 2;
}

message LogoutAllRequest {
  string user_id = 1;
}

message LogoutAllResponse {
  bool success = 1;
  int64 session_count = 2;
}

message SelectAccountResponse {
  LoginStatus status = 1;
  string user_id = 2;
  string account_id = 3;
  string tenant_id = 4;
  string display_name = 5;
  string session_id = 6;
  string access_token = 7;
  string refresh_token = 8;
  int64 expires_in = 9;
  string next_step = 10;
}

message LoginResponse {
  LoginStatus status = 1;
  string user_id = 2;
  string challenge_id = 3;
  string access_token = 4;
  string refresh_token = 5;
  int64 expires_in = 6;
  repeated AccountCandidate accounts = 7;
  string login_method = 8;
}
