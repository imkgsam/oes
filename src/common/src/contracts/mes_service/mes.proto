syntax = "proto3";

package mes_service;

option java_multiple_files = true;
option java_package = "com.oes.mes.v1";

service ProductionSpecManagementService {
  rpc CreateProductionSpec(CreateProductionSpecRequest) returns (CreateProductionSpecResponse);
  rpc UpdateProductionSpec(UpdateProductionSpecRequest) returns (UpdateProductionSpecResponse);
  rpc ActivateProductionSpec(ActivateProductionSpecRequest) returns (ActivateProductionSpecResponse);
  rpc RetireProductionSpec(RetireProductionSpecRequest) returns (RetireProductionSpecResponse);
}

service ProductionSpecQueryService {
  rpc GetProductionSpec(GetProductionSpecRequest) returns (GetProductionSpecResponse);
  rpc ListProductionSpecs(ListProductionSpecsRequest) returns (ListProductionSpecsResponse);
  rpc ResolveProductionSpecsForMold(ResolveProductionSpecsForMoldRequest) returns (ResolveProductionSpecsForMoldResponse);
}

service MoldManagementService {
  rpc RegisterMoldDesign(RegisterMoldDesignRequest) returns (RegisterMoldDesignResponse);
  rpc RegisterMasterMold(RegisterMasterMoldRequest) returns (RegisterMasterMoldResponse);
  rpc RegisterProductionMold(RegisterProductionMoldRequest) returns (RegisterProductionMoldResponse);
  rpc ConfirmProductionMoldArrival(ConfirmProductionMoldArrivalRequest) returns (ConfirmProductionMoldArrivalResponse);
  rpc AcceptProductionMold(AcceptProductionMoldRequest) returns (AcceptProductionMoldResponse);
  rpc MoveTooling(MoveToolingRequest) returns (MoveToolingResponse);
  rpc InstallTooling(InstallToolingRequest) returns (InstallToolingResponse);
  rpc UnmountTooling(UnmountToolingRequest) returns (UnmountToolingResponse);
  rpc ConfirmInstalledMoldReady(ConfirmInstalledMoldReadyRequest) returns (ConfirmInstalledMoldReadyResponse);
  rpc MarkInstalledMoldMaintenance(MarkInstalledMoldMaintenanceRequest) returns (MarkInstalledMoldMaintenanceResponse);
  rpc RecordMoldUsage(RecordMoldUsageRequest) returns (RecordMoldUsageResponse);
  rpc RecordMoldUsageBatch(RecordMoldUsageBatchRequest) returns (RecordMoldUsageBatchResponse);
  rpc AdjustMoldLifeCounter(AdjustMoldLifeCounterRequest) returns (AdjustMoldLifeCounterResponse);
  rpc MarkProductionMoldForScrap(MarkProductionMoldForScrapRequest) returns (MarkProductionMoldForScrapResponse);
}

service MoldQueryService {
  rpc GetMoldDesign(GetMoldDesignRequest) returns (GetMoldDesignResponse);
  rpc ListMoldDesigns(ListMoldDesignsRequest) returns (ListMoldDesignsResponse);
  rpc GetMasterMold(GetMasterMoldRequest) returns (GetMasterMoldResponse);
  rpc ListMasterMolds(ListMasterMoldsRequest) returns (ListMasterMoldsResponse);
  rpc GetProductionMold(GetProductionMoldRequest) returns (GetProductionMoldResponse);
  rpc ListProductionMolds(ListProductionMoldsRequest) returns (ListProductionMoldsResponse);
  rpc ListProductionMoldsByDesign(ListProductionMoldsByDesignRequest) returns (ListProductionMoldsByDesignResponse);
  rpc GetToolingCurrentPlacement(GetToolingCurrentPlacementRequest) returns (GetToolingCurrentPlacementResponse);
  rpc GetMoldUsageHistory(GetMoldUsageHistoryRequest) returns (GetMoldUsageHistoryResponse);
  rpc ListCurrentMoldsByWorkCenter(ListCurrentMoldsByWorkCenterRequest) returns (ListCurrentMoldsByWorkCenterResponse);
  rpc ListMoldLifeCounters(ListMoldLifeCountersRequest) returns (ListMoldLifeCountersResponse);
}

