syntax = "proto3";

package mes_service;

option java_multiple_files = true;
option java_package = "com.oes.mes.v1";

service MoldManagementService {
  rpc RegisterMoldDesign(RegisterMoldDesignRequest) returns (RegisterMoldDesignResponse);
  rpc RegisterMasterMold(RegisterMasterMoldRequest) returns (RegisterMasterMoldResponse);
  rpc RegisterProductionMoldInstance(RegisterProductionMoldInstanceRequest) returns (RegisterProductionMoldInstanceResponse);
  rpc MoveMold(MoveMoldRequest) returns (MoveMoldResponse);
  rpc InstallMold(InstallMoldRequest) returns (InstallMoldResponse);
  rpc UnmountMold(UnmountMoldRequest) returns (UnmountMoldResponse);
  rpc RecordMoldUsage(RecordMoldUsageRequest) returns (RecordMoldUsageResponse);
  rpc AdjustMoldLife(AdjustMoldLifeRequest) returns (AdjustMoldLifeResponse);
  rpc AcknowledgeMoldWarning(AcknowledgeMoldWarningRequest) returns (AcknowledgeMoldWarningResponse);
  rpc ScrapMold(ScrapMoldRequest) returns (ScrapMoldResponse);
}

service MoldQueryService {
  rpc GetMoldDesign(GetMoldDesignRequest) returns (GetMoldDesignResponse);
  rpc ListMoldDesigns(ListMoldDesignsRequest) returns (ListMoldDesignsResponse);
  rpc GetProductionMoldInstance(GetProductionMoldInstanceRequest) returns (GetProductionMoldInstanceResponse);
  rpc ListMoldInstancesByDesign(ListMoldInstancesByDesignRequest) returns (ListMoldInstancesByDesignResponse);
  rpc GetMoldCurrentLocation(GetMoldCurrentLocationRequest) returns (GetMoldCurrentLocationResponse);
  rpc GetMoldUsageHistory(GetMoldUsageHistoryRequest) returns (GetMoldUsageHistoryResponse);
  rpc ListCurrentMoldsByWorkCenter(ListCurrentMoldsByWorkCenterRequest) returns (ListCurrentMoldsByWorkCenterResponse);
  rpc ListMoldLifeWarnings(ListMoldLifeWarningsRequest) returns (ListMoldLifeWarningsResponse);
  rpc PrintDailyMoldChecklist(PrintDailyMoldChecklistRequest) returns (PrintDailyMoldChecklistResponse);
}

