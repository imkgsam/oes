message RevokeAccountRoleRequest {
  // Legacy compatibility selector only; canonical bindings must never be inferred from it.
  string account_id = 1 [deprecated = true];
  string role_id = 2 [deprecated = true];
}

message RevokeAccountRoleResponse {}

// Targets exactly one immutable binding and never falls back to an account/role selector.
message RevokePrincipalRoleBindingRequest {
  string binding_id = 1;
  string reason = 2;
}

// Preserves the facts recorded by the first successful revoke for every idempotent retry.
message PrincipalRoleBindingRevokeResult {
  string binding_id = 1;
  string revoked_at = 2;
  string revoked_by_operator_id = 3;
  string reason = 4;
  string audit_event_id = 5;
}

message RevokePrincipalRoleBindingResponse {
  PrincipalRoleBindingRevokeResult result = 1;
