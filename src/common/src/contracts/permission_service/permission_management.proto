syntax = "proto3";

package permission_service;

option java_multiple_files = true;
option java_package = "com.oes.permission.v1";

service PermissionManagementService {
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse);
  rpc BatchCreatePermissions(BatchCreatePermissionsRequest) returns (BatchCreatePermissionsResponse);
  rpc UpdatePermission(UpdatePermissionRequest) returns (UpdatePermissionResponse);
  rpc DeletePermission(DeletePermissionRequest) returns (DeletePermissionResponse);
  rpc GetPermissionById(GetPermissionByIdRequest) returns (GetPermissionByIdResponse);
  rpc GetPermissionByCode(GetPermissionByCodeRequest) returns (GetPermissionByCodeResponse);
  rpc ListPermissionsPaged(ListPermissionsPagedRequest) returns (ListPermissionsPagedResponse);
  rpc ListPermissionRoles(ListPermissionRolesRequest) returns (ListPermissionRolesResponse);

  rpc CreateRoleTemplate(CreateRoleTemplateRequest) returns (CreateRoleTemplateResponse);
  rpc CreateRoleInstance(CreateRoleInstanceRequest) returns (CreateRoleInstanceResponse);
  rpc GetRoleTemplateById(GetRoleTemplateByIdRequest) returns (GetRoleTemplateByIdResponse);
  rpc UpdateRoleTemplate(UpdateRoleTemplateRequest) returns (UpdateRoleTemplateResponse);
  rpc DeleteRoleTemplate(DeleteRoleTemplateRequest) returns (DeleteRoleTemplateResponse);
  rpc SetRoleTemplateEnabled(SetRoleTemplateEnabledRequest) returns (SetRoleTemplateEnabledResponse);
  rpc ListRoleTemplatePermissions(ListRoleTemplatePermissionsRequest) returns (ListRoleTemplatePermissionsResponse);
  rpc AssignRoleTemplatePermission(AssignRoleTemplatePermissionRequest) returns (AssignRoleTemplatePermissionResponse);
  rpc RevokeRoleTemplatePermission(RevokeRoleTemplatePermissionRequest) returns (RevokeRoleTemplatePermissionResponse);
  rpc CreateRoleInstanceFromTemplate(CreateRoleInstanceFromTemplateRequest) returns (CreateRoleInstanceFromTemplateResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc SetRoleEnabled(SetRoleEnabledRequest) returns (SetRoleEnabledResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRoleById(GetRoleByIdRequest) returns (GetRoleByIdResponse);
  rpc ListRoleInstances(ListRoleInstancesRequest) returns (ListRoleInstancesResponse);
  rpc ListRoleTemplates(ListRoleTemplatesRequest) returns (ListRoleTemplatesResponse);
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (ListRolePermissionsResponse);

  rpc AssignRolePermission(AssignRolePermissionRequest) returns (AssignRolePermissionResponse);
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (RevokeRolePermissionResponse);

  rpc AssignAccountRole(AssignAccountRoleRequest) returns (AssignAccountRoleResponse);
  rpc EnsureTenantRoleInstanceFromTemplate(EnsureTenantRoleInstanceFromTemplateRequest) returns (EnsureTenantRoleInstanceFromTemplateResponse);
  rpc GrantInitialAccessForEmployeeAccount(GrantInitialAccessForEmployeeAccountRequest) returns (GrantInitialAccessForEmployeeAccountResponse);
  rpc GrantInitialAccessForTenantAccount(GrantInitialAccessForTenantAccountRequest) returns (GrantInitialAccessForTenantAccountResponse);
  rpc RevokeAccountRole(RevokeAccountRoleRequest) returns (RevokeAccountRoleResponse) {
    option deprecated = true;
  }
  rpc RevokePrincipalRoleBinding(RevokePrincipalRoleBindingRequest) returns (RevokePrincipalRoleBindingResponse);
  rpc ListAccountRoles(ListAccountRolesRequest) returns (ListAccountRolesResponse);
  rpc ListRoleAccounts(ListRoleAccountsRequest) returns (ListRoleAccountsResponse);
  rpc GetAccountRoleSelection(GetAccountRoleSelectionRequest) returns (GetAccountRoleSelectionResponse);
  rpc SetAccountRoles(SetAccountRolesRequest) returns (SetAccountRolesResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  rpc ListNavigationEntries(ListNavigationEntriesRequest) returns (ListNavigationEntriesResponse);
  rpc GetNavigationEntry(GetNavigationEntryRequest) returns (GetNavigationEntryResponse);
  rpc CreateNavigationEntry(CreateNavigationEntryRequest) returns (CreateNavigationEntryResponse);
  rpc UpdateNavigationEntry(UpdateNavigationEntryRequest) returns (UpdateNavigationEntryResponse);
  rpc GetRoleNavigation(GetRoleNavigationRequest) returns (GetRoleNavigationResponse);
  rpc SetRoleNavigationVisibility(SetRoleNavigationVisibilityRequest) returns (SetRoleNavigationVisibilityResponse);
  rpc SetRoleLandingPolicies(SetRoleLandingPoliciesRequest) returns (SetRoleLandingPoliciesResponse);
  rpc SyncRoleNavigationFromTemplate(SyncRoleNavigationFromTemplateRequest) returns (SyncRoleNavigationFromTemplateResponse);
  rpc ResolveNavigationPreview(ResolveNavigationPreviewRequest) returns (ResolveNavigationPreviewResponse);

  rpc GetRoleTerminalAccess(GetRoleTerminalAccessRequest) returns (GetRoleTerminalAccessResponse);
  rpc SetRoleTerminalAccess(SetRoleTerminalAccessRequest) returns (SetRoleTerminalAccessResponse);
  rpc GetAccountTerminalAccess(GetAccountTerminalAccessRequest) returns (GetAccountTerminalAccessResponse);
  rpc ReplaceAccountTerminalAccessOverride(ReplaceAccountTerminalAccessOverrideRequest) returns (ReplaceAccountTerminalAccessOverrideResponse);
  rpc DeleteAccountTerminalAccessOverride(DeleteAccountTerminalAccessOverrideRequest) returns (DeleteAccountTerminalAccessOverrideResponse);
}

