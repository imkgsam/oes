syntax = "proto3";

package permission_service;

option java_multiple_files = true;
option java_package = "com.oes.permission.v1";

import "google/protobuf/empty.proto";

service PermissionManagementService {
  rpc CreatePermission(CreatePermissionRequest) returns (PermissionResponse);
  rpc DeletePermission(DeletePermissionRequest) returns (google.protobuf.Empty);
  rpc GetPermissionById(GetPermissionByIdRequest) returns (PermissionResponse);
  rpc GetPermissionByCode(GetPermissionByCodeRequest) returns (PermissionResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc ListPermissionsByModule(ListPermissionsByModuleRequest) returns (ListPermissionsResponse);

  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc SetRoleEnabled(SetRoleEnabledRequest) returns (RoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
  rpc GetRoleById(GetRoleByIdRequest) returns (RoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (ListPermissionsResponse);

  rpc AssignRolePermission(AssignRolePermissionRequest) returns (google.protobuf.Empty);
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (google.protobuf.Empty);

  rpc AssignAccountRole(AssignAccountRoleRequest) returns (google.protobuf.Empty);
  rpc RevokeAccountRole(RevokeAccountRoleRequest) returns (google.protobuf.Empty);
  rpc ListAccountRoles(ListAccountRolesRequest) returns (ListRolesResponse);
  rpc ListRoleAccounts(ListRoleAccountsRequest) returns (ListRoleAccountsResponse);
  rpc GetAccountRoleSelection(GetAccountRoleSelectionRequest) returns (AccountRoleSelectionResponse);
  rpc SetAccountRoles(SetAccountRolesRequest) returns (ListRolesResponse);
}

enum RoleKindProto {
  ROLE_KIND_PROTO_UNSPECIFIED = 0;
  ROLE_KIND_PROTO_SYSTEM_TEMPLATE = 1;
  ROLE_KIND_PROTO_TENANT_INSTANCE = 2;
}

message CreatePermissionRequest {
  string code = 1;
  string module = 2;
  string description = 3;
}

message DeletePermissionRequest {
  string id = 1;
}

message GetPermissionByIdRequest {
  string id = 1;
}

message GetPermissionByCodeRequest {
  string code = 1;
}

message ListPermissionsRequest {}

message ListPermissionsByModuleRequest {
  string module = 1;
}

message PermissionResponse {
  string id = 1;
  string code = 2;
  string module = 3;
  string description = 4;
}

message ListPermissionsResponse {
  repeated PermissionResponse permissions = 1;
}

message CreateRoleRequest {
  string name = 1;
  string code = 2;
  string tenant_id = 3;
  bool is_system = 4;
  string description = 5;
  string created_by = 6;
  RoleKindProto role_kind = 7;
  string template_role_id = 8;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

message SetRoleEnabledRequest {
  string id = 1;
  bool is_enabled = 2;
}

message DeleteRoleRequest {
  string id = 1;
}

message GetRoleByIdRequest {
  string id = 1;
}

message ListRolesRequest {}

message ListRolePermissionsRequest {
  string role_id = 1;
}

message RoleResponse {
  string id = 1;
  string name = 2;
  string code = 3;
  string tenant_id = 4;
  bool is_system = 5;
  bool is_enabled = 6;
  string description = 7;
  RoleKindProto role_kind = 8;
  string template_role_id = 9;
}

message ListRolesResponse {
  repeated RoleResponse roles = 1;
}

message AssignRolePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
  string created_by = 3;
}

message RevokeRolePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message AssignAccountRoleRequest {
  string account_id = 1;
  string account_type = 2;
  string role_id = 3;
  string tenant_id = 4;
  string created_by = 5;
}

message RevokeAccountRoleRequest {
  string account_id = 1;
  string role_id = 2;
}

message ListAccountRolesRequest {
  string account_id = 1;
  string tenant_id = 2;
}

message GetAccountRoleSelectionRequest {
  string account_id = 1;
  string tenant_id = 2;
}

message SetAccountRolesRequest {
  string account_id = 1;
  string account_type = 2;
  string tenant_id = 3;
  repeated string role_ids = 4;
}

message ListRoleAccountsRequest {
  string role_id = 1;
}

message AccountRoleBindingResponse {
  string account_id = 1;
  string account_type = 2;
  string role_id = 3;
  string tenant_id = 4;
}

message ListRoleAccountsResponse {
  repeated AccountRoleBindingResponse accounts = 1;
}

message AccountRoleSelectionResponse {
  repeated RoleResponse available_roles = 1;
  repeated string selected_role_ids = 2;
}
