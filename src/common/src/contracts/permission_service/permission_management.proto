syntax = "proto3";

package permission_service;

option java_multiple_files = true;
option java_package = "com.oes.permission.v1";

import "google/protobuf/empty.proto";

service PermissionManagementService {
  rpc CreatePermission(CreatePermissionRequest) returns (PermissionResponse);
  rpc BatchCreatePermissions(BatchCreatePermissionsRequest) returns (ListPermissionsResponse);
  rpc UpdatePermission(UpdatePermissionRequest) returns (PermissionResponse);
  rpc DeletePermission(DeletePermissionRequest) returns (google.protobuf.Empty);
  rpc GetPermissionById(GetPermissionByIdRequest) returns (PermissionResponse);
  rpc GetPermissionByCode(GetPermissionByCodeRequest) returns (PermissionResponse);
  rpc ListPermissionsPaged(ListPermissionsPagedRequest) returns (PagedPermissionsResponse);
  rpc ListPermissionRoles(ListPermissionRolesRequest) returns (ListRolesResponse);

  rpc CreateRoleTemplate(CreateRoleTemplateRequest) returns (RoleResponse);
  rpc CreateRoleInstance(CreateRoleInstanceRequest) returns (RoleResponse);
  rpc GetRoleTemplateById(GetRoleTemplateByIdRequest) returns (RoleResponse);
  rpc UpdateRoleTemplate(UpdateRoleTemplateRequest) returns (RoleResponse);
  rpc DeleteRoleTemplate(DeleteRoleTemplateRequest) returns (google.protobuf.Empty);
  rpc SetRoleTemplateEnabled(SetRoleTemplateEnabledRequest) returns (RoleResponse);
  rpc ListRoleTemplatePermissions(ListRoleTemplatePermissionsRequest) returns (ListPermissionsResponse);
  rpc AssignRoleTemplatePermission(AssignRoleTemplatePermissionRequest) returns (google.protobuf.Empty);
  rpc RevokeRoleTemplatePermission(RevokeRoleTemplatePermissionRequest) returns (google.protobuf.Empty);
  rpc CreateRoleInstanceFromTemplate(CreateRoleInstanceFromTemplateRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc SetRoleEnabled(SetRoleEnabledRequest) returns (RoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
  rpc GetRoleById(GetRoleByIdRequest) returns (RoleResponse);
  rpc ListRoleInstances(ListRoleInstancesRequest) returns (PagedRolesResponse);
  rpc ListRoleTemplates(ListRoleTemplatesRequest) returns (PagedRolesResponse);
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (ListPermissionsResponse);

  rpc AssignRolePermission(AssignRolePermissionRequest) returns (google.protobuf.Empty);
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (google.protobuf.Empty);

  rpc AssignAccountRole(AssignAccountRoleRequest) returns (google.protobuf.Empty);
  rpc RevokeAccountRole(RevokeAccountRoleRequest) returns (google.protobuf.Empty);
  rpc ListAccountRoles(ListAccountRolesRequest) returns (ListRolesResponse);
  rpc ListRoleAccounts(ListRoleAccountsRequest) returns (ListRoleAccountsResponse);
  rpc GetAccountRoleSelection(GetAccountRoleSelectionRequest) returns (AccountRoleSelectionResponse);
  rpc SetAccountRoles(SetAccountRolesRequest) returns (ListRolesResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

enum RoleKindProto {
  ROLE_KIND_PROTO_UNSPECIFIED = 0;
  ROLE_KIND_PROTO_SYSTEM_TEMPLATE = 1;
  ROLE_KIND_PROTO_TENANT_INSTANCE = 2;
  ROLE_KIND_PROTO_SYSTEM_INSTANCE = 3;
}

message CreatePermissionRequest {
  string code = 1;
  string module = 2;
  string description = 3;
}

message BatchCreatePermissionItem {
  string code = 1;
  string module = 2;
  string description = 3;
}

message BatchCreatePermissionsRequest {
  repeated BatchCreatePermissionItem permissions = 1;
}

message DeletePermissionRequest {
  string id = 1;
}

message UpdatePermissionRequest {
  string id = 1;
  string module = 2;
  string description = 3;
}

message GetPermissionByIdRequest {
  string id = 1;
}

message GetPermissionByCodeRequest {
  string code = 1;
}

message ListPermissionsPagedRequest {
  int32 page = 1;
  int32 page_size = 2;
  string module = 3;
  string keyword = 4;
}

message ListPermissionRolesRequest {
  string permission_id = 1;
}

message PermissionResponse {
  string id = 1;
  string code = 2;
  string module = 3;
  string description = 4;
}

message ListPermissionsResponse {
  repeated PermissionResponse permissions = 1;
}

message PagedPermissionsResponse {
  repeated PermissionResponse permissions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CreateRoleTemplateRequest {
  string name = 1;
  string code = 2;
  string description = 3;
}

message CreateRoleInstanceRequest {
  string name = 1;
  string code = 2;
  string tenant_id = 3;
  string description = 4;
  string template_role_id = 5;
  string scope_level = 6;
}

message GetRoleTemplateByIdRequest {
  string id = 1;
}

message UpdateRoleTemplateRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

message DeleteRoleTemplateRequest {
  string id = 1;
}

message SetRoleTemplateEnabledRequest {
  string id = 1;
  bool is_enabled = 2;
}

message ListRoleTemplatePermissionsRequest {
  string role_template_id = 1;
}

message AssignRoleTemplatePermissionRequest {
  string role_template_id = 1;
  string permission_id = 2;
}

message RevokeRoleTemplatePermissionRequest {
  string role_template_id = 1;
  string permission_id = 2;
}

message CreateRoleInstanceFromTemplateRequest {
  string template_role_id = 1;
  string tenant_id = 2;
  string name = 3;
  string code = 4;
  string description = 5;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

message SetRoleEnabledRequest {
  string id = 1;
  bool is_enabled = 2;
}

message DeleteRoleRequest {
  string id = 1;
}

message GetRoleByIdRequest {
  string id = 1;
}

message ListRoleInstancesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string tenant_id = 3;
  string keyword = 4;
  string scope_level = 5;
}

message ListRoleTemplatesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message ListRolePermissionsRequest {
  string role_id = 1;
}

message RoleResponse {
  string id = 1;
  string name = 2;
  string code = 3;
  string tenant_id = 4;
  bool is_system = 5;
  bool is_enabled = 6;
  string description = 7;
  RoleKindProto role_kind = 8;
  string template_role_id = 9;
}

message ListRolesResponse {
  repeated RoleResponse roles = 1;
}

message PagedRolesResponse {
  repeated RoleResponse roles = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AssignRolePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
  string created_by = 3;
}

message RevokeRolePermissionRequest {
  string role_id = 1;
  string permission_id = 2;
}

message AssignAccountRoleRequest {
  string account_id = 1;
  string account_type = 2;
  string role_id = 3;
  string tenant_id = 4;
  string created_by = 5;
  string effective_at = 6;
  string expires_at = 7;
  string scope_level = 8;
}

message RevokeAccountRoleRequest {
  string account_id = 1;
  string role_id = 2;
}

message ListAccountRolesRequest {
  string account_id = 1;
  string tenant_id = 2;
  string scope_level = 3;
}

message GetAccountRoleSelectionRequest {
  string account_id = 1;
  string tenant_id = 2;
  string scope_level = 3;
}

message SetAccountRolesRequest {
  string account_id = 1;
  string account_type = 2;
  string tenant_id = 3;
  repeated string role_ids = 4;
  string scope_level = 5;
}

message ListRoleAccountsRequest {
  string role_id = 1;
}

message AccountRoleBindingResponse {
  string account_id = 1;
  string account_type = 2;
  string role_id = 3;
  string tenant_id = 4;
  string scope_level = 5;
}

message ListRoleAccountsResponse {
  repeated AccountRoleBindingResponse accounts = 1;
}

message AccountRoleSelectionResponse {
  repeated RoleResponse available_roles = 1;
  repeated string selected_role_ids = 2;
}

message ListAuditEventsRequest {
  string service = 1;
  string module = 2;
  string event_type = 3;
  string result = 4;
  string operator_id = 5;
  string tenant_id = 6;
  string org_id = 7;
  string resource_type = 8;
  string resource_id = 9;
  string occurred_at_from = 10;
  string occurred_at_to = 11;
  int32 page_size = 12;
  string cursor = 13;
}

message PermissionAuditEventRecord {
  string event_id = 1;
  string service = 2;
  string module = 3;
  string event_type = 4;
  string occurred_at = 5;
  string result = 6;
  string operator_id = 7;
  string operator_type = 8;
  string tenant_id = 9;
  string org_id = 10;
  string trace_id = 11;
  string resource_type = 12;
  string resource_id = 13;
  string details_json = 14;
}

message ListAuditEventsResponse {
  repeated PermissionAuditEventRecord items = 1;
  string next_cursor = 2;
}
