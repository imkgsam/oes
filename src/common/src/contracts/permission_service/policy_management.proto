syntax = "proto3";

package permission_service;

option java_multiple_files = true;
option java_package = "com.oes.permission.v1";

service PolicyManagementService {
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc TogglePolicy(TogglePolicyRequest) returns (TogglePolicyResponse);
  rpc GetPolicyById(GetPolicyByIdRequest) returns (GetPolicyByIdResponse);
  rpc ListPoliciesPaged(ListPoliciesPagedRequest) returns (ListPoliciesPagedResponse);
  rpc ListPoliciesByPermission(ListPoliciesByPermissionRequest) returns (ListPoliciesByPermissionResponse);
  rpc AddPermissionPolicy(AddPermissionPolicyRequest) returns (AddPermissionPolicyResponse);
  rpc RemovePermissionPolicy(RemovePermissionPolicyRequest) returns (RemovePermissionPolicyResponse);
}

enum PolicyEffectProto {
  POLICY_EFFECT_PROTO_UNSPECIFIED = 0;
  POLICY_EFFECT_PROTO_ALLOW = 1;
  POLICY_EFFECT_PROTO_DENY = 2;
}

enum PolicySubjectTypeProto {
  POLICY_SUBJECT_TYPE_PROTO_UNSPECIFIED = 0;
  POLICY_SUBJECT_TYPE_PROTO_ROLE = 1;
  POLICY_SUBJECT_TYPE_PROTO_ACCOUNT = 2;
  POLICY_SUBJECT_TYPE_PROTO_ANY = 3;
}

message CreatePolicyRequest {
  string name = 1;
  PolicyEffectProto effect = 2;
  string description = 3;
  string tenant_id = 4;
  PolicySubjectTypeProto subject_type = 5;
  string subject_id = 6;
  string permission_code = 7;
  string resource_type = 8;
  int32 priority = 9;
  string created_by = 10;
  string condition_ast_json = 11;
}

message UpdatePolicyRequest {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  PolicySubjectTypeProto subject_type = 5;
  string subject_id = 6;
  string permission_code = 7;
  string resource_type = 8;
  int32 priority = 9;
  string condition_ast_json = 10;
}

message DeletePolicyRequest {
  string id = 1;
}

message TogglePolicyRequest {
  string id = 1;
  bool is_enabled = 2;
}

message GetPolicyByIdRequest {
  string id = 1;
}

message ListPoliciesPagedRequest {
  int32 page = 1;
  int32 page_size = 2;
  string tenant_id = 3;
  string permission_code = 4;
  bool is_enabled = 5;
  string keyword = 6;
  PolicySubjectTypeProto subject_type = 7;
  string subject_id = 8;
}

message ListPoliciesByPermissionRequest {
  string permission_code = 1;
  string tenant_id = 2;
}

message AddPermissionPolicyRequest {
  string permission_code = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string resource_type = 8;
  int32 priority = 9;
  string condition_ast_json = 10;
}

message RemovePermissionPolicyRequest {
  string permission_code = 1;
  string policy_id = 2;
}

message CreatePolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message UpdatePolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message DeletePolicyResponse {}

message TogglePolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message GetPolicyByIdResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message PolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message ListPoliciesResponse {
  repeated PolicyResponse policies = 1;
}

message ListPoliciesByPermissionResponse {
  repeated PolicyResponse policies = 1;
}

message PagedPoliciesResponse {
  repeated PolicyResponse policies = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListPoliciesPagedResponse {
  repeated PolicyResponse policies = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AddPermissionPolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  string condition_ast_json = 12;
}

message RemovePermissionPolicyResponse {}
