syntax = "proto3";

package permission_service;

option java_multiple_files = true;
option java_package = "com.oes.permission.v1";

import "google/protobuf/empty.proto";

service PolicyManagementService {
  rpc CreatePolicy(CreatePolicyRequest) returns (PolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (PolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (google.protobuf.Empty);
  rpc TogglePolicy(TogglePolicyRequest) returns (PolicyResponse);
  rpc GetPolicyById(GetPolicyByIdRequest) returns (PolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc ListPoliciesPaged(ListPoliciesPagedRequest) returns (PagedPoliciesResponse);
  rpc ListPoliciesByPermission(ListPoliciesByPermissionRequest) returns (ListPoliciesResponse);
  rpc AddPermissionPolicy(AddPermissionPolicyRequest) returns (PolicyResponse);
  rpc RemovePermissionPolicy(RemovePermissionPolicyRequest) returns (google.protobuf.Empty);
}

enum PolicyEffectProto {
  POLICY_EFFECT_PROTO_UNSPECIFIED = 0;
  POLICY_EFFECT_PROTO_ALLOW = 1;
  POLICY_EFFECT_PROTO_DENY = 2;
}

enum PolicySubjectTypeProto {
  POLICY_SUBJECT_TYPE_PROTO_UNSPECIFIED = 0;
  POLICY_SUBJECT_TYPE_PROTO_ROLE = 1;
  POLICY_SUBJECT_TYPE_PROTO_ACCOUNT = 2;
  POLICY_SUBJECT_TYPE_PROTO_ANY = 3;
}

enum AttributeSourceProto {
  ATTRIBUTE_SOURCE_PROTO_UNSPECIFIED = 0;
  ATTRIBUTE_SOURCE_PROTO_SUBJECT = 1;
  ATTRIBUTE_SOURCE_PROTO_RESOURCE = 2;
  ATTRIBUTE_SOURCE_PROTO_ENVIRONMENT = 3;
  ATTRIBUTE_SOURCE_PROTO_ACTION = 4;
}

enum ConditionOperatorProto {
  CONDITION_OPERATOR_PROTO_UNSPECIFIED = 0;
  CONDITION_OPERATOR_PROTO_EQUALS = 1;
  CONDITION_OPERATOR_PROTO_NOT_EQUALS = 2;
  CONDITION_OPERATOR_PROTO_IN = 3;
  CONDITION_OPERATOR_PROTO_NOT_IN = 4;
  CONDITION_OPERATOR_PROTO_GREATER_THAN = 5;
  CONDITION_OPERATOR_PROTO_GREATER_THAN_OR_EQUAL = 6;
  CONDITION_OPERATOR_PROTO_LESS_THAN = 7;
  CONDITION_OPERATOR_PROTO_LESS_THAN_OR_EQUAL = 8;
  CONDITION_OPERATOR_PROTO_BETWEEN = 9;
  CONDITION_OPERATOR_PROTO_CONTAINS = 10;
  CONDITION_OPERATOR_PROTO_STARTS_WITH = 11;
  CONDITION_OPERATOR_PROTO_REGEX = 12;
  CONDITION_OPERATOR_PROTO_IS_NULL = 13;
  CONDITION_OPERATOR_PROTO_IS_NOT_NULL = 14;
}

message PolicyConditionInput {
  AttributeSourceProto attribute_source = 1;
  string attribute_key = 2;
  ConditionOperatorProto operator = 3;
  string value = 4;
}

message PolicyConditionResponse {
  string id = 1;
  AttributeSourceProto attribute_source = 2;
  string attribute_key = 3;
  ConditionOperatorProto operator = 4;
  string value = 5;
}

message CreatePolicyRequest {
  string name = 1;
  PolicyEffectProto effect = 2;
  string description = 3;
  string tenant_id = 4;
  PolicySubjectTypeProto subject_type = 5;
  string subject_id = 6;
  string permission_code = 7;
  string resource_type = 8;
  int32 priority = 9;
  repeated PolicyConditionInput conditions = 10;
  string created_by = 11;
}

message UpdatePolicyRequest {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  PolicySubjectTypeProto subject_type = 5;
  string subject_id = 6;
  string permission_code = 7;
  string resource_type = 8;
  int32 priority = 9;
  repeated PolicyConditionInput conditions = 10;
}

message DeletePolicyRequest {
  string id = 1;
}

message TogglePolicyRequest {
  string id = 1;
  bool is_enabled = 2;
}

message GetPolicyByIdRequest {
  string id = 1;
}

message ListPoliciesRequest {
  string tenant_id = 1;
}

message ListPoliciesPagedRequest {
  int32 page = 1;
  int32 page_size = 2;
  string tenant_id = 3;
  string permission_code = 4;
  bool is_enabled = 5;
  string keyword = 6;
}

message ListPoliciesByPermissionRequest {
  string permission_code = 1;
  string tenant_id = 2;
}

message AddPermissionPolicyRequest {
  string permission_code = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string resource_type = 8;
  int32 priority = 9;
  repeated PolicyConditionInput conditions = 10;
}

message RemovePermissionPolicyRequest {
  string permission_code = 1;
  string policy_id = 2;
}

message PolicyResponse {
  string id = 1;
  string name = 2;
  PolicyEffectProto effect = 3;
  string description = 4;
  string tenant_id = 5;
  PolicySubjectTypeProto subject_type = 6;
  string subject_id = 7;
  string permission_code = 8;
  string resource_type = 9;
  int32 priority = 10;
  bool is_enabled = 11;
  repeated PolicyConditionResponse conditions = 12;
}

message ListPoliciesResponse {
  repeated PolicyResponse policies = 1;
}

message PagedPoliciesResponse {
  repeated PolicyResponse policies = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
