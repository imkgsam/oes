syntax = "proto3";

package tenant_org_service;

option java_multiple_files = true;
option java_package = "com.oes.tenantorg.v1";

service TenantOrgQueryService {
  rpc ResolveAuthSessionTenantLifecycle(ResolveAuthSessionTenantLifecycleRequest) returns (ResolveAuthSessionTenantLifecycleResponse);
  rpc ResolvePublicBusinessCardOrganization(ResolvePublicBusinessCardOrganizationRequest) returns (ResolvePublicBusinessCardOrganizationResponse);
  rpc GetTenantById(GetTenantByIdRequest) returns (GetTenantByIdResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetOrgTreeByTenantId(GetOrgTreeByTenantIdRequest) returns (GetOrgTreeByTenantIdResponse);
  rpc GetOrgUnitById(GetOrgUnitByIdRequest) returns (GetOrgUnitByIdResponse);
  rpc ValidateOrgReference(ValidateOrgReferenceRequest) returns (ValidateOrgReferenceResponse);
  rpc GetOrgReferenceSummary(GetOrgReferenceSummaryRequest) returns (GetOrgReferenceSummaryResponse);
  rpc ListAncestorOrgUnits(ListAncestorOrgUnitsRequest) returns (ListAncestorOrgUnitsResponse);
  rpc ListDescendantOrgUnits(ListDescendantOrgUnitsRequest) returns (ListDescendantOrgUnitsResponse);
}

message ResolveAuthSessionTenantLifecycleRequest {
  string tenant_id = 1;
}

message ResolveAuthSessionTenantLifecycleResponse {
  string tenant_id = 1;
  string lifecycle_status = 2;
}

message ResolvePublicBusinessCardOrganizationRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
}

message ResolvePublicBusinessCardOrganizationResponse {
  bool available = 1;
  string tenant_id = 2;
  string company_display_name = 3;
  string website_url = 4;
  string org_unit_id = 5;
  string org_unit_display_name = 6;
  string reason_code = 7;
}

service TenantOrgManagementService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc StartTenantOnboarding(StartTenantOnboardingRequest) returns (StartTenantOnboardingResponse);
  rpc GetTenantOnboarding(GetTenantOnboardingRequest) returns (GetTenantOnboardingResponse);
  rpc RetryTenantOnboarding(RetryTenantOnboardingRequest) returns (RetryTenantOnboardingResponse);
  rpc UpdateTenantProfile(UpdateTenantProfileRequest) returns (UpdateTenantProfileResponse);
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse);
  rpc ReactivateTenant(ReactivateTenantRequest) returns (ReactivateTenantResponse);
  rpc ArchiveTenant(ArchiveTenantRequest) returns (ArchiveTenantResponse);
  rpc CreateOrgUnit(CreateOrgUnitRequest) returns (CreateOrgUnitResponse);
  rpc UpdateOrgUnit(UpdateOrgUnitRequest) returns (UpdateOrgUnitResponse);
  rpc MoveOrgUnit(MoveOrgUnitRequest) returns (MoveOrgUnitResponse);
  rpc ArchiveOrgUnit(ArchiveOrgUnitRequest) returns (ArchiveOrgUnitResponse);
}

message TenantSummary {
  string id = 1;
  string code = 2;
  string name = 3;
  string status = 4;
  string root_org_id = 5;
  string employee_code_prefix = 6;
  string website_url = 7;
}

message OrgUnitSummary {
  string id = 1;
  string tenant_id = 2;
  string parent_org_id = 3;
  string name = 4;
  string type = 5;
  string status = 6;
  string path = 7;
  int32 depth = 8;
  int32 sort_order = 9;
  string organization_tenant_party_id = 10;
}

message OrgNode {
  OrgUnitSummary org_unit = 1;
  repeated OrgNode children = 2;
}

message ValidationResult {
  bool valid = 1;
  string rejection_reason = 2;
  OrgUnitSummary org_unit_summary = 3;
}

message GetTenantByIdRequest {
  string tenant_id = 1;
}

message GetTenantByIdResponse {
  TenantSummary tenant = 1;
}

message ListTenantsRequest {
  string keyword = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListTenantsResponse {
  repeated TenantSummary tenants = 1;
  int32 total = 2;
}

message GetOrgTreeByTenantIdRequest {
  string tenant_id = 1;
}

message GetOrgTreeByTenantIdResponse {
  repeated OrgNode roots = 1;
}

message GetOrgUnitByIdRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
}

message GetOrgUnitByIdResponse {
  OrgUnitSummary org_unit = 1;
}

message ValidateOrgReferenceRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
  string expected_org_type = 3;
}

message ValidateOrgReferenceResponse {
  ValidationResult result = 1;
}

message GetOrgReferenceSummaryRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
}

message GetOrgReferenceSummaryResponse {
  OrgUnitSummary org_unit = 1;
}

message ListAncestorOrgUnitsRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
}

message ListAncestorOrgUnitsResponse {
  repeated OrgUnitSummary ancestors = 1;
}

message ListDescendantOrgUnitsRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
  int32 max_depth = 3;
}

message ListDescendantOrgUnitsResponse {
  repeated OrgUnitSummary descendants = 1;
}

message CreateTenantRequest {
  string code = 1;
  string name = 2;
  string root_org_name = 3;
  string employee_code_prefix = 4;
}

message CreateTenantResponse {
  TenantSummary tenant = 1;
  OrgUnitSummary root_org_unit = 2;
}

message TenantOnboardingTenantInput {
  string code = 1;
  string name = 2;
  string employee_code_prefix = 3;
}

message TenantOnboardingIdentifierInput {
  string identifier_type = 1;
  string raw_value = 2;
  string normalized_value = 3;
  string issuer_country_or_region = 4;
}

message TenantOnboardingOrganizationTenantPartyInput {
  string legal_name = 1;
  string registered_country = 2;
  repeated TenantOnboardingIdentifierInput identifiers = 3;
}

message TenantOnboardingRootOrgInput {
  string name = 1;
}

message TenantOnboardingFirstAdminInput {
  string display_name = 1;
  string email = 2;
  string phone = 3;
  bool require_password_setup = 4;
  // CREATE_NEW_USER or EXISTING_USER.
  string provisioning_mode = 5;
  string existing_user_id = 6;
}

message StartTenantOnboardingRequest {
  string idempotency_key = 1;
  TenantOnboardingTenantInput tenant = 2;
  TenantOnboardingOrganizationTenantPartyInput organization_tenant_party = 3;
  TenantOnboardingRootOrgInput root_org = 4;
  TenantOnboardingFirstAdminInput first_admin = 5;
}

message GetTenantOnboardingRequest {
  string onboarding_id = 1;
}

message RetryTenantOnboardingRequest {
  string onboarding_id = 1;
  string reason = 2;
}

message StartTenantOnboardingResponse {
  TenantOnboardingResult onboarding = 1;
}

message GetTenantOnboardingResponse {
  TenantOnboardingResult onboarding = 1;
}

message RetryTenantOnboardingResponse {
  TenantOnboardingResult onboarding = 1;
}

message TenantOnboardingStep {
  string key = 1;
  string status = 2;
  string message = 3;
  int32 attempt_count = 4;
}

message TenantOnboardingFailure {
  string code = 1;
  string message = 2;
  string failed_step = 3;
  bool retryable = 4;
}

message TenantOnboardingOrganizationTenantPartyResult {
  reserved 1;
  reserved "party_id";
  string tenant_party_id = 2;
}

message TenantOnboardingFirstAdminResult {
  string user_id = 1;
  string account_id = 2;
  reserved 3;
  reserved "person_party_id";
  string tenant_party_id = 4;
}

message TenantOnboardingAccessResult {
  string role_code = 1;
  string role_id = 2;
  string grant_id = 3;
  string hr_admin_role_code = 4;
  string hr_admin_role_id = 5;
  string hr_admin_grant_id = 6;
  string account_basic_role_code = 7;
  string account_basic_role_id = 8;
}

message TenantOnboardingFirstAdminEmployeeResult {
  string employee_id = 1;
  string employment_id = 2;
  string access_process_id = 3;
}

message TenantOnboardingResult {
  string onboarding_id = 1;
  string status = 2;
  TenantSummary tenant = 3;
  OrgUnitSummary root_org = 4;
  TenantOnboardingOrganizationTenantPartyResult organization_tenant_party = 5;
  TenantOnboardingFirstAdminResult first_admin = 6;
  TenantOnboardingAccessResult access = 7;
  repeated TenantOnboardingStep steps = 8;
  TenantOnboardingFailure failure = 9;
  TenantOnboardingFirstAdminEmployeeResult first_admin_employee = 10;
}

message UpdateTenantProfileRequest {
  string tenant_id = 1;
  string name = 2;
  string code = 3;
  string employee_code_prefix = 4;
  string website_url = 5;
}

message UpdateTenantProfileResponse {
  TenantSummary tenant = 1;
}

message SuspendTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message SuspendTenantResponse {
  TenantSummary tenant = 1;
}

message ReactivateTenantRequest {
  string tenant_id = 1;
}

message ReactivateTenantResponse {
  TenantSummary tenant = 1;
}

message ArchiveTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message ArchiveTenantResponse {
  TenantSummary tenant = 1;
}

message CreateOrgUnitRequest {
  string tenant_id = 1;
  string parent_org_id = 2;
  string name = 3;
  string type = 4;
  int32 sort_order = 5;
  optional string organization_tenant_party_id = 6;
}

message CreateOrgUnitResponse {
  OrgUnitSummary org_unit = 1;
}

message UpdateOrgUnitRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
  string name = 3;
  string type = 4;
  int32 sort_order = 5;
  optional string organization_tenant_party_id = 6;
}

message UpdateOrgUnitResponse {
  OrgUnitSummary org_unit = 1;
}

message MoveOrgUnitRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
  string new_parent_org_id = 3;
}

message MoveOrgUnitResponse {
  OrgUnitSummary org_unit = 1;
}

message ArchiveOrgUnitRequest {
  string tenant_id = 1;
  string org_unit_id = 2;
  string reason = 3;
}

message ArchiveOrgUnitResponse {
  OrgUnitSummary org_unit = 1;
}
