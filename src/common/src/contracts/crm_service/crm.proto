syntax = "proto3";

package crm_service;

option java_multiple_files = true;
option java_package = "com.oes.crm.v1";

service CustomerQueryService {
  rpc ListCrmAccounts(ListCrmAccountsRequest) returns (ListCrmAccountsResponse);
  rpc GetCrmAccount(GetCrmAccountRequest) returns (GetCrmAccountResponse);
  rpc ListSourceRecords(ListSourceRecordsRequest) returns (ListSourceRecordsResponse);
  rpc CheckLeadDuplicate(CheckLeadDuplicateRequest) returns (CheckLeadDuplicateResponse);
}

service CustomerManagementService {
  rpc CreateDraftLead(CreateDraftLeadRequest) returns (CreateDraftLeadResponse);
  rpc UpdateDraftLead(UpdateDraftLeadRequest) returns (UpdateDraftLeadResponse);
  rpc SubmitDraftLead(SubmitDraftLeadRequest) returns (SubmitDraftLeadResponse);
  rpc DeleteDraftLead(DeleteDraftLeadRequest) returns (DeleteDraftLeadResponse);
  rpc CreateLead(CreateLeadRequest) returns (CreateLeadResponse);
  rpc ClaimCrmAccount(ClaimCrmAccountRequest) returns (ClaimCrmAccountResponse);
  rpc ReleaseCrmAccount(ReleaseCrmAccountRequest) returns (ReleaseCrmAccountResponse);
  rpc ArchiveCrmAccount(ArchiveCrmAccountRequest) returns (ArchiveCrmAccountResponse);
  rpc UpdateCrmAccountIdentifiers(UpdateCrmAccountIdentifiersRequest) returns (UpdateCrmAccountIdentifiersResponse);
  rpc ConvertLeadToProspectCustomer(ConvertLeadToProspectCustomerRequest) returns (ConvertLeadToProspectCustomerResponse);
}

service CrmObjectReferenceService {
  rpc ValidateCrmObjectReference(ValidateCrmObjectReferenceRequest) returns (ValidateCrmObjectReferenceResponse);
}

enum CrmObjectReferenceCapability {
  CRM_OBJECT_REFERENCE_CAPABILITY_UNSPECIFIED = 0;
  CRM_OBJECT_REFERENCE_CAPABILITY_READ = 1;
  CRM_OBJECT_REFERENCE_CAPABILITY_CREATE_ANNOTATION = 2;
  CRM_OBJECT_REFERENCE_CAPABILITY_MUTATE_ANNOTATION = 3;
}

enum CrmObjectLifecycle {
  CRM_OBJECT_LIFECYCLE_UNSPECIFIED = 0;
  CRM_OBJECT_LIFECYCLE_ACTIVE = 1;
  CRM_OBJECT_LIFECYCLE_ARCHIVED = 2;
  CRM_OBJECT_LIFECYCLE_DELETED_OR_UNAVAILABLE = 3;
}

message OperatorContext {
  string operator_id = 1;
  string operator_type = 2;
  string org_id = 3;
}

message TraceContext {
  string trace_id = 1;
  string request_id = 2;
}

message AuditContext {
  string audit_id = 1;
  string reason = 2;
  string source = 3;
}

message CrmLeadIdentifier {
  string identifier_type = 1;
  string normalized_value = 2;
  string raw_value = 3;
  string issuer_country_or_region = 4;
}

message CrmAccountProfileItemInput {
  string item_type = 1;
  string normalized_value = 2;
  string raw_value = 3;
  string label = 4;
  string role = 5;
}

message CrmAccountProfileItem {
  string profile_item_id = 1;
  string item_type = 2;
  string normalized_value = 3;
  string raw_value = 4;
  string label = 5;
  string role = 6;
  string status = 7;
  string source_record_id = 8;
  string promoted_target_type = 9;
  string promoted_target_id = 10;
  string promoted_at = 11;
  string created_at = 12;
  string updated_at = 13;
}

message CrmAccountP1 {
  string crm_account_id = 1;
  string tenant_id = 2;
  string tenant_party_id = 3;
  string record_status = 4;
  string lifecycle_stage = 5;
  string party_type_hint = 6;
  string display_name = 7;
  string lead_legal_name = 26;
  string lead_company_name = 8;
  string lead_person_name = 9;
  string lead_domain = 10;
  string lead_email = 11;
  string lead_phone = 12;
  string lead_whatsapp = 13;
  string lead_country = 14;
  repeated CrmLeadIdentifier lead_identifiers = 15;
  string owner_account_id = 16;
  string priority = 17;
  string last_activity_at = 18;
  string next_follow_up_at = 19;
  string created_by = 20;
  string created_at = 21;
  string updated_at = 22;
  string archived_at = 23;
  string archive_reason = 24;
  repeated CrmAccountProfileItem profile_items = 25;
}

message CrmDuplicateCandidate {
  string crm_account_id = 1;
  string tenant_id = 2;
  string display_name = 3;
  string owner_account_id = 4;
  string record_status = 5;
  string lifecycle_stage = 6;
  repeated string matched_fields = 7;
  string confidence = 8;
}

message CrmLeadDuplicateResult {
  string result_type = 1;
  repeated CrmDuplicateCandidate candidates = 2;
}

message CrmPartyCandidate {
  string tenant_party_id = 1;
  string display_name = 2;
  double confidence = 3;
  repeated string matched_fields = 4;
  repeated string conflict_flags = 5;
}

message CreateLeadRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string display_name = 5;
  string party_type_hint = 6;
  string lead_legal_name = 29;
  string lead_company_name = 7;
  string lead_person_name = 8;
  string lead_domain = 9;
  string lead_email = 10;
  string lead_phone = 11;
  string lead_whatsapp = 12;
  string lead_country = 13;
  repeated CrmLeadIdentifier lead_identifiers = 14;
  string owner_account_id = 15;
  string priority = 16;
  string next_follow_up_at = 17;
  bool duplicate_warning_acknowledged = 18;
  string source_type = 19;
  string source_name = 20;
  string source_captured_at = 21;
  string source_captured_by_account_id = 22;
  string source_external_reference = 23;
  string source_raw_payload_json = 24;
  string source_note = 25;
  bool claim_for_current_user = 26;
  string assignment_intent = 27;
  repeated CrmAccountProfileItemInput profile_items = 28;
}

message CreateLeadResponse {
  string result_type = 1;
  CrmAccountP1 crm_account = 2;
  CrmLeadDuplicateResult duplicate_result = 3;
}

message ConvertLeadToProspectCustomerRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
  bool allow_ownerless_conversion = 6;
  string legal_name = 7;
}

message ConvertLeadToProspectCustomerResponse {
  string result_type = 1;
  CrmAccountP1 crm_account = 2;
  repeated CrmPartyCandidate candidates = 3;
  string existing_crm_account_id = 4;
}

message CheckLeadDuplicateRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  string display_name = 4;
  string lead_legal_name = 14;
  string lead_company_name = 5;
  string lead_person_name = 6;
  string lead_domain = 7;
  string lead_email = 8;
  string lead_phone = 9;
  string lead_whatsapp = 10;
  string lead_country = 11;
  repeated CrmLeadIdentifier lead_identifiers = 12;
  repeated CrmAccountProfileItemInput profile_items = 13;
}

message CheckLeadDuplicateResponse {
  CrmLeadDuplicateResult duplicate_result = 1;
}

message CreateDraftLeadRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string display_name = 5;
  string party_type_hint = 6;
  string lead_legal_name = 25;
  string lead_company_name = 7;
  string lead_person_name = 8;
  string lead_domain = 9;
  string lead_email = 10;
  string lead_phone = 11;
  string lead_whatsapp = 12;
  string lead_country = 13;
  repeated CrmLeadIdentifier lead_identifiers = 14;
  string priority = 15;
  string next_follow_up_at = 16;
  string source_type = 17;
  string source_name = 18;
  string source_captured_at = 19;
  string source_captured_by_account_id = 20;
  string source_external_reference = 21;
  string source_raw_payload_json = 22;
  string source_note = 23;
  repeated CrmAccountProfileItemInput profile_items = 24;
}

message CreateDraftLeadResponse {
  CrmAccountP1 crm_account = 1;
}

message UpdateDraftLeadRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
  string display_name = 6;
  string party_type_hint = 7;
  string lead_legal_name = 19;
  string lead_company_name = 8;
  string lead_person_name = 9;
  string lead_domain = 10;
  string lead_email = 11;
  string lead_phone = 12;
  string lead_whatsapp = 13;
  string lead_country = 14;
  repeated CrmLeadIdentifier lead_identifiers = 15;
  string priority = 16;
  string next_follow_up_at = 17;
  repeated CrmAccountProfileItemInput profile_items = 18;
}

message UpdateDraftLeadResponse {
  CrmAccountP1 crm_account = 1;
}

message SubmitDraftLeadRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
  bool duplicate_warning_acknowledged = 6;
  bool claim_for_current_user = 7;
  string source_type = 8;
  string source_name = 9;
  string source_captured_at = 10;
  string source_captured_by_account_id = 11;
  string source_external_reference = 12;
  string source_raw_payload_json = 13;
  string source_note = 14;
  string assignment_intent = 15;
}

message SubmitDraftLeadResponse {
  string result_type = 1;
  CrmAccountP1 crm_account = 2;
  CrmLeadDuplicateResult duplicate_result = 3;
}

message DeleteDraftLeadRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
}

message DeleteDraftLeadResponse {
  bool deleted = 1;
  string crm_account_id = 2;
}

message ClaimCrmAccountRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
}

message ClaimCrmAccountResponse {
  CrmAccountP1 crm_account = 1;
}

message ReleaseCrmAccountRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
}

message ReleaseCrmAccountResponse {
  CrmAccountP1 crm_account = 1;
}

message ArchiveCrmAccountRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
  string archive_reason = 6;
}

message ArchiveCrmAccountResponse {
  CrmAccountP1 crm_account = 1;
}

message UpdateCrmAccountIdentifiersRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  AuditContext audit_context = 4;
  string crm_account_id = 5;
  repeated CrmLeadIdentifier lead_identifiers = 6;
}

message UpdateCrmAccountIdentifiersResponse {
  CrmAccountP1 crm_account = 1;
}

message ListCrmAccountsRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  string keyword = 4;
  string lifecycle_stage = 5;
  string record_status = 6;
  string owner_account_id = 7;
  uint32 page = 8;
  uint32 page_size = 9;
  bool ownerless = 10;
  string created_by = 11;
  repeated string lifecycle_stages = 12;
}

message ListCrmAccountsResponse {
  repeated CrmAccountP1 crm_accounts = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GetCrmAccountRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  string crm_account_id = 4;
}

message GetCrmAccountResponse {
  CrmAccountP1 crm_account = 1;
}

message CrmSourceRecord {
  string source_record_id = 1;
  string crm_account_id = 2;
  string source_type = 3;
  string source_name = 4;
  string captured_at = 5;
  string captured_by_account_id = 6;
  string external_reference = 7;
  string raw_payload_json = 8;
  string note = 9;
  bool is_primary = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ListSourceRecordsRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  string crm_account_id = 4;
}

message ListSourceRecordsResponse {
  repeated CrmSourceRecord source_records = 1;
}

message CrmObjectRef {
  string object_owner_service = 1;
  string object_type = 2;
  string object_id = 3;
}

message CrmObjectDisplaySnapshot {
  string title = 1;
  string subtitle = 2;
  string status = 3;
}

message ValidateCrmObjectReferenceRequest {
  string tenant_id = 1;
  OperatorContext operator_context = 2;
  TraceContext trace_context = 3;
  string object_type = 4;
  string object_id = 5;
  CrmObjectReferenceCapability requested_capability = 6;
}

message ValidateCrmObjectReferenceResponse {
  CrmObjectRef object_ref = 1;
  bool exists = 2;
  bool readable = 3;
  bool capability_allowed = 4;
  CrmObjectLifecycle object_lifecycle = 5;
  CrmObjectDisplaySnapshot display_snapshot = 6;
  string deny_reason = 7;
}
