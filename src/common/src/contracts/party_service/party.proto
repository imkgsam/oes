syntax = "proto3";

package party_service;

option java_multiple_files = true;
option java_package = "com.oes.party.v1";

service PartyRegistrationService {
  rpc RegisterTenantParty(RegisterTenantPartyRequest) returns (RegisterTenantPartyResponse);
  rpc DeactivateTenantParty(DeactivateTenantPartyRequest) returns (DeactivateTenantPartyResponse);
}

service PartyQueryService {
  rpc GetTenantPartyById(GetTenantPartyByIdRequest) returns (GetTenantPartyByIdResponse);
  rpc ResolveTenantPartyByIdentifier(ResolveTenantPartyByIdentifierRequest) returns (ResolveTenantPartyByIdentifierResponse);
  rpc ResolveTenantPartyForConsumer(ResolveTenantPartyForConsumerRequest) returns (ResolveTenantPartyForConsumerResponse);
  rpc SearchTenantPartyCandidates(SearchTenantPartyCandidatesRequest) returns (SearchTenantPartyCandidatesResponse);
}

message TenantPartyIdentifierInput {
  string identifier_type = 1;
  string normalized_value = 2;
  string raw_value = 3;
  string issuer_country_or_region = 4;
  string status = 5;
}

message TenantPartyContactPointInput {
  string contact_point_type = 1;
  string normalized_value = 2;
  string raw_value = 3;
  string label = 4;
}

message TenantPartySummary {
  string id = 1;
  string tenant_id = 2;
  string type = 3;
  string status = 4;
  string legal_name = 5;
  string display_name = 6;
  string local_code = 7;
  string registered_country = 8;
}

message TenantPartyCandidate {
  TenantPartySummary tenant_party = 1;
  double confidence = 2;
  repeated string match_signals = 3;
}

message ResolvedTenantPartyCandidate {
  TenantPartySummary tenant_party = 1;
  double confidence = 2;
  repeated string matched_fields = 3;
  repeated string conflict_flags = 4;
}

message RegisterTenantPartyRequest {
  string tenant_id = 1;
  string type = 2;
  string legal_name = 3;
  string display_name = 4;
  string local_code = 5;
  string registered_country = 6;
  repeated TenantPartyIdentifierInput identifiers = 7;
  string idempotency_key = 8;
  repeated TenantPartyContactPointInput contact_points = 9;
}

message RegisterTenantPartyResponse {
  TenantPartySummary tenant_party = 1;
  string match_result = 2;
}

message DeactivateTenantPartyRequest {
  string tenant_id = 1;
  string tenant_party_id = 2;
  string reason = 3;
}

message DeactivateTenantPartyResponse {
  TenantPartySummary tenant_party = 1;
}

message GetTenantPartyByIdRequest {
  string tenant_id = 1;
  string tenant_party_id = 2;
}

message GetTenantPartyByIdResponse {
  TenantPartySummary tenant_party = 1;
}

message ResolveTenantPartyByIdentifierRequest {
  string tenant_id = 1;
  string identifier_type = 2;
  string normalized_value = 3;
  string raw_value = 4;
  string issuer_country_or_region = 5;
}

message ResolveTenantPartyByIdentifierResponse {
  string match_type = 1;
  TenantPartySummary tenant_party = 2;
}

message ResolveTenantPartyForConsumerRequest {
  string tenant_id = 1;
  string type_hint = 2;
  string name = 3;
  string country = 4;
  string domain = 5;
  string email = 6;
  string phone = 7;
  string whatsapp = 8;
  repeated TenantPartyIdentifierInput identifiers = 9;
}

message ResolveTenantPartyForConsumerResponse {
  string result = 1;
  TenantPartySummary tenant_party = 2;
  repeated ResolvedTenantPartyCandidate candidates = 3;
  repeated string matched_fields = 4;
}

message SearchTenantPartyCandidatesRequest {
  string tenant_id = 1;
  string keyword = 2;
  string party_type = 3;
  string registered_country = 4;
  repeated TenantPartyIdentifierInput identifiers = 5;
}

message SearchTenantPartyCandidatesResponse {
  repeated TenantPartyCandidate candidates = 1;
}
