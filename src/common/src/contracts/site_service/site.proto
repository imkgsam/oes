}

message ActivateLocaleRequest {
  AdminRequestContext context = 1;
  string site_id = 2;
  string locale = 3;
}

message ActivateLocaleResponse {
  bool activated = 1;
}

message DisableLocaleRequest {
  AdminRequestContext context = 1;
  string site_id = 2;
  string locale = 3;
}

message DisableLocaleResponse {
