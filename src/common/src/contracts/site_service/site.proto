}

message GetLatestPublishStateRequest {
  SignedSiteContext signed_context = 1;
  uint32 local_publish_version = 2;
}

message GetLatestPublishStateResponse {
  string site_id = 1;
  uint32 latest_publish_version = 2;
  string latest_sync_id = 3;
  bool has_updates = 4;
  string server_time = 5;
}

message ListChangedResourcesRequest {
  SignedSiteContext signed_context = 1;
  uint32 from_publish_version = 2;
  uint32 to_publish_version = 3;
  repeated string resource_types = 4;
}

message ListChangedResourcesResponse {
  string site_id = 1;
  uint32 from_publish_version = 2;
  uint32 to_publish_version = 3;
  bool requires_snapshot = 4;
  repeated SiteSyncResourceRecord changed_resources = 5;
}

message PublicViewEnvelope {
  string site_id = 1;
  string resource_type = 2;
  string resource_id = 3;
  string locale = 4;
  string slug = 5;
  string status = 6;
  uint32 publish_version = 7;
  string updated_at = 8;
  string payload_json = 9;
}

message PublicViewResourceRef {
  string resource_type = 1;
  string resource_id = 2;
  string locale = 3;
}

message BatchGetPublicViewsRequest {
  SignedSiteContext signed_context = 1;
  repeated PublicViewResourceRef resources = 2;
  uint32 target_publish_version = 3;
}

message BatchGetPublicViewsResponse {
  repeated PublicViewEnvelope public_views = 1;
  repeated PublicViewResourceRef missing_resources = 2;
  uint32 server_publish_version = 3;
  SiteExposurePublication exposure_publication = 4;
}

message GetSnapshotRequest {
  SignedSiteContext signed_context = 1;
  repeated string resource_types = 2;
  repeated string locales = 3;
  string page_token = 4;
  uint32 page_size = 5;
  uint32 target_publish_version = 6;
}

message GetSnapshotResponse {
  string site_id = 1;
  uint32 snapshot_publish_version = 2;
  repeated PublicViewEnvelope public_views = 3;
  string next_page_token = 4;
  bool is_complete = 5;
  SiteExposurePublication exposure_publication = 6;
}

message ReportSyncResultRequest {
  SignedSiteContext signed_context = 1;
  string sync_id = 2;
  uint32 local_publish_version = 3;
  string status = 4;
  string started_at = 5;
  string completed_at = 6;
  string error_code = 7;
  string error_message = 8;
}

message ReportSyncResultResponse {
  bool accepted = 1;
  string server_time = 2;
}

message GetPreviewViewRequest {
  SignedSiteContext signed_context = 1;
  string preview_token = 2;
  string resource_type = 3;
  string resource_id = 4;
  string locale = 5;
}

message GetPreviewViewResponse {
  PublicViewEnvelope preview_view = 1;
  string expires_at = 2;
  bool noindex = 3;
  string cache_policy = 4;
}
