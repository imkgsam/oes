syntax = "proto3";

package site_service;

option java_multiple_files = true;
option java_package = "com.oes.site.v1";

service SiteAdminManagementService {
  rpc ListSiteCards(ListSiteCardsRequest) returns (ListSiteCardsResponse);
  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse);
  rpc UpdateSiteSettings(UpdateSiteSettingsRequest) returns (UpdateSiteSettingsResponse);
  rpc DisableSite(DisableSiteRequest) returns (DisableSiteResponse);
  rpc AddPreparingLocale(AddPreparingLocaleRequest) returns (AddPreparingLocaleResponse);
  rpc CheckLocaleCompleteness(CheckLocaleCompletenessRequest) returns (CheckLocaleCompletenessResponse);
  rpc ActivateLocale(ActivateLocaleRequest) returns (ActivateLocaleResponse);
  rpc DisableLocale(DisableLocaleRequest) returns (DisableLocaleResponse);
  rpc ListSitePages(ListSitePagesRequest) returns (ListSitePagesResponse);
  rpc UpdateSitePageGovernance(UpdateSitePageGovernanceRequest) returns (UpdateSitePageGovernanceResponse);
  rpc ListSiteCategories(ListSiteCategoriesRequest) returns (ListSiteCategoriesResponse);
  rpc CreateSiteCategory(CreateSiteCategoryRequest) returns (CreateSiteCategoryResponse);
  rpc UpdateSiteCategory(UpdateSiteCategoryRequest) returns (UpdateSiteCategoryResponse);
  rpc UnpublishSiteCategory(UnpublishSiteCategoryRequest) returns (UnpublishSiteCategoryResponse);
  rpc ListSiteProducts(ListSiteProductsRequest) returns (ListSiteProductsResponse);
  rpc SearchProductMasterForAdd(SearchProductMasterForAddRequest) returns (SearchProductMasterForAddResponse);
  rpc GetSiteProductPublication(GetSiteProductPublicationRequest) returns (GetSiteProductPublicationResponse);
  rpc AddProductsToSite(AddProductsToSiteRequest) returns (AddProductsToSiteResponse);
  rpc UpdateSiteProductPublication(UpdateSiteProductPublicationRequest) returns (UpdateSiteProductPublicationResponse);
  rpc UnpublishSiteProduct(UnpublishSiteProductRequest) returns (UnpublishSiteProductResponse);
  rpc ListSiteContents(ListSiteContentsRequest) returns (ListSiteContentsResponse);
  rpc GetSiteContent(GetSiteContentRequest) returns (GetSiteContentResponse);
  rpc CreateSiteContent(CreateSiteContentRequest) returns (CreateSiteContentResponse);
  rpc UpdateSiteContentLocaleVersion(UpdateSiteContentLocaleVersionRequest) returns (UpdateSiteContentLocaleVersionResponse);
  rpc UnpublishSiteContent(UnpublishSiteContentRequest) returns (UnpublishSiteContentResponse);
  rpc ListContentCategories(ListContentCategoriesRequest) returns (ListContentCategoriesResponse);
  rpc GetContentCategory(GetContentCategoryRequest) returns (GetContentCategoryResponse);
  rpc CreateContentCategory(CreateContentCategoryRequest) returns (CreateContentCategoryResponse);
  rpc UpdateContentCategoryLocaleVersion(UpdateContentCategoryLocaleVersionRequest) returns (UpdateContentCategoryLocaleVersionResponse);
  rpc PublishContentCategoryLocale(PublishContentCategoryLocaleRequest) returns (PublishContentCategoryLocaleResponse);
  rpc ReorderContentCategories(ReorderContentCategoriesRequest) returns (ReorderContentCategoriesResponse);
  rpc DeleteContentCategory(DeleteContentCategoryRequest) returns (DeleteContentCategoryResponse);
  rpc ListVisibleContentCategories(ListVisibleContentCategoriesRequest) returns (ListVisibleContentCategoriesResponse);
  rpc CheckContentCategoryCompleteness(CheckContentCategoryCompletenessRequest) returns (CheckContentCategoryCompletenessResponse);
  rpc ListContentCategoryUsage(ListContentCategoryUsageRequest) returns (ListContentCategoryUsageResponse);
  rpc ListFaqCategories(ListFaqCategoriesRequest) returns (ListFaqCategoriesResponse);
  rpc GetFaqCategory(GetFaqCategoryRequest) returns (GetFaqCategoryResponse);
  rpc CreateFaqCategory(CreateFaqCategoryRequest) returns (CreateFaqCategoryResponse);
  rpc UpdateFaqCategoryLocaleVersion(UpdateFaqCategoryLocaleVersionRequest) returns (UpdateFaqCategoryLocaleVersionResponse);
  rpc DisableFaqCategory(DisableFaqCategoryRequest) returns (DisableFaqCategoryResponse);
  rpc ListFaqEntries(ListFaqEntriesRequest) returns (ListFaqEntriesResponse);
  rpc GetFaqEntry(GetFaqEntryRequest) returns (GetFaqEntryResponse);
  rpc CreateFaqEntry(CreateFaqEntryRequest) returns (CreateFaqEntryResponse);
  rpc UpdateFaqEntryLocaleVersion(UpdateFaqEntryLocaleVersionRequest) returns (UpdateFaqEntryLocaleVersionResponse);
  rpc UnpublishFaqEntry(UnpublishFaqEntryRequest) returns (UnpublishFaqEntryResponse);
  rpc CheckFaqCompleteness(CheckFaqCompletenessRequest) returns (CheckFaqCompletenessResponse);
  rpc GetPendingSyncSummary(GetPendingSyncSummaryRequest) returns (GetPendingSyncSummaryResponse);
  rpc ListPendingSyncResources(ListPendingSyncResourcesRequest) returns (ListPendingSyncResourcesResponse);
  rpc ListSyncHistory(ListSyncHistoryRequest) returns (ListSyncHistoryResponse);
  rpc GetSyncDetail(GetSyncDetailRequest) returns (GetSyncDetailResponse);
  rpc SyncAllPendingChanges(SyncAllPendingChangesRequest) returns (SyncAllPendingChangesResponse);
  rpc RetryLastSync(RetryLastSyncRequest) returns (RetryLastSyncResponse);
  rpc ResendWebhook(ResendWebhookRequest) returns (ResendWebhookResponse);
  rpc ListSiteCredentials(ListSiteCredentialsRequest) returns (ListSiteCredentialsResponse);
  rpc GenerateSiteCredential(GenerateSiteCredentialRequest) returns (GenerateSiteCredentialResponse);
  rpc RotateSiteCredential(RotateSiteCredentialRequest) returns (RotateSiteCredentialResponse);
  rpc RevokeSiteCredential(RevokeSiteCredentialRequest) returns (RevokeSiteCredentialResponse);
  rpc ListSiteAuditLogs(ListSiteAuditLogsRequest) returns (ListSiteAuditLogsResponse);
  rpc IssuePreviewToken(IssuePreviewTokenRequest) returns (IssuePreviewTokenResponse);
}

service SiteRuntimeSyncService {
  rpc RegisterPageCapabilities(RegisterPageCapabilitiesRequest) returns (RegisterPageCapabilitiesResponse);
  rpc GetLatestPublishState(GetLatestPublishStateRequest) returns (GetLatestPublishStateResponse);
  rpc ListChangedResources(ListChangedResourcesRequest) returns (ListChangedResourcesResponse);
  rpc BatchGetPublicViews(BatchGetPublicViewsRequest) returns (BatchGetPublicViewsResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ReportSyncResult(ReportSyncResultRequest) returns (ReportSyncResultResponse);
  rpc GetPreviewView(GetPreviewViewRequest) returns (GetPreviewViewResponse);
}

message AdminRequestContext {
  string tenant_id = 1;
  string org_id = 2;
  string operator_id = 3;
  string trace_id = 4;
  string request_id = 5;
}

message SignedSiteContext {
  string site_id = 1;
  string client_id = 2;
  string credential_id = 3;
  string request_id = 4;
  string trace_id = 5;
  string timestamp = 6;
  string nonce = 7;
  string signature = 8;
  string method = 9;
  string path = 10;
  string normalized_query = 11;
  string body_sha256 = 12;
  string idempotency_key = 13;
}

message ListSiteCardsRequest {
  string tenant_id = 1;
  string operator_id = 2;
  string trace_id = 3;
}

message SiteCard {
  string site_id = 1;
  string site_name = 2;
  string site_type = 3;
  string primary_domain = 4;
  string brand_id = 5;
  string region_code = 6;
  string channel_code = 7;
  string status = 8;
  repeated string active_locales = 9;
  repeated string preparing_locales = 10;
  string runtime_status = 11;
  uint32 pending_sync_count = 12;
  uint32 latest_publish_version = 13;
  uint32 runtime_publish_version = 14;
  string last_sync_at = 15;
  string last_error_summary = 16;
}

message ListSiteCardsResponse {
  repeated SiteCard cards = 1;
}

message CreateSiteRequest {
  string tenant_id = 1;
  string org_id = 2;
  string operator_id = 3;
  string trace_id = 4;
  string site_name = 5;
  string site_type = 6;
  string brand_id = 7;
  string region_code = 8;
  string channel_code = 9;
  string default_locale = 10;
  string primary_domain = 11;
  string preview_base_url = 12;
}

message CreateSiteResponse {
  string site_id = 1;
  string status = 2;
  string default_locale = 3;
}

message UpdateSiteSettingsRequest {
  AdminRequestContext context = 1;
  string site_id = 2;
  string site_name = 3;
  string primary_domain = 4;
  string preview_base_url = 5;
  string webhook_url = 6;
  string runtime_status_url = 7;
  repeated string allowed_origins = 8;
}

message UpdateSiteSettingsResponse {
  bool updated = 1;
}

message DisableSiteRequest {
  AdminRequestContext context = 1;
  string site_id = 2;
  string reason = 3;
}

message DisableSiteResponse {
  bool disabled = 1;
}

message AddPreparingLocaleRequest {
