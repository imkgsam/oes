syntax = "proto3";

package asset_service;

option java_multiple_files = true;
option java_package = "com.oes.asset.v1";

service SiteMediaAssetService {
  rpc UploadSiteMedia(stream UploadSiteMediaRequest) returns (UploadSiteMediaResponse);
  rpc ListAuthorizedSiteMedia(ListAuthorizedSiteMediaRequest) returns (ListAuthorizedSiteMediaResponse);
  rpc ResolveSiteMediaForPublication(ResolveSiteMediaForPublicationRequest) returns (ResolveSiteMediaForPublicationResponse);
  rpc PrepareSiteMediaRemoteDelivery(PrepareSiteMediaRemoteDeliveryRequest) returns (PrepareSiteMediaRemoteDeliveryResponse);
  rpc ActivateSiteMediaRemoteDelivery(ActivateSiteMediaRemoteDeliveryRequest) returns (ActivateSiteMediaRemoteDeliveryResponse);
  rpc ProtectSitePublicationReferences(ProtectSitePublicationReferencesRequest) returns (ProtectSitePublicationReferencesResponse);
  rpc ReleaseSitePublicationReferences(ReleaseSitePublicationReferencesRequest) returns (ReleaseSitePublicationReferencesResponse);
  rpc ArchiveSiteMedia(ArchiveSiteMediaRequest) returns (ArchiveSiteMediaResponse);
  rpc TakeDownSiteMedia(TakeDownSiteMediaRequest) returns (TakeDownSiteMediaResponse);
  rpc GetSiteMediaDeliveryStatus(GetSiteMediaDeliveryStatusRequest) returns (GetSiteMediaDeliveryStatusResponse);
  rpc DeleteSiteMedia(DeleteSiteMediaRequest) returns (DeleteSiteMediaResponse);
}

message UploadSiteMediaStart { string idempotency_key = 1; string site_id = 2; string requested_media_kind = 3; string original_file_name = 4; string declared_content_type = 5; }
message UploadSiteMediaRequest { oneof payload { UploadSiteMediaStart start = 1; bytes content_chunk = 2; } }
message UploadSiteMediaChunk { oneof payload { UploadSiteMediaStart start = 1; bytes content_chunk = 2; } }
message SiteMediaAssetSummary { string asset_id = 1; string media_kind = 2; string lifecycle_status = 3; string delivery_status = 4; string preview_url = 5; uint32 width = 6; uint32 height = 7; uint64 duration_ms = 8; string created_at = 9; uint64 availability_version = 10; }
message ResolvedSiteMedia { string asset_id = 1; string media_kind = 2; string lifecycle_status = 3; string delivery_status = 4; string public_url = 5; uint32 width = 6; uint32 height = 7; uint64 duration_ms = 8; string codec = 9; uint64 availability_version = 10; }
message UploadSiteMediaResponse { SiteMediaAssetSummary asset = 1; }
message ListAuthorizedSiteMediaRequest { string site_id = 1; string query = 2; string media_kind_filter = 3; bool include_archived = 4; uint32 page_size = 5; string page_token = 6; }
message ListAuthorizedSiteMediaResponse { repeated SiteMediaAssetSummary assets = 1; string next_page_token = 2; }
message ResolveSiteMediaForPublicationRequest { string site_id = 1; string asset_id = 2; string required_media_kind = 3; }
message ResolveSiteMediaForPublicationResponse { ResolvedSiteMedia resolved = 1; }
message PrepareSiteMediaRemoteDeliveryRequest { string idempotency_key = 1; string site_id = 2; string media_host = 3; }
message PrepareSiteMediaRemoteDeliveryResponse { string delivery_binding_status = 1; string validation_operation_id = 2; }
message ActivateSiteMediaRemoteDeliveryRequest { string idempotency_key = 1; string site_id = 2; }
message ActivateSiteMediaRemoteDeliveryResponse { string delivery_binding_status = 1; string migration_operation_id = 2; }
message ProtectSitePublicationReferencesRequest { string idempotency_key = 1; string site_id = 2; uint64 publish_version = 3; repeated string asset_ids = 4; }
message ProtectSitePublicationReferencesResponse { repeated string protected_asset_ids = 1; string protection_status = 2; }
message ReleaseSitePublicationReferencesRequest { string idempotency_key = 1; string site_id = 2; uint64 publish_version = 3; }
message ReleaseSitePublicationReferencesResponse { repeated string released_asset_ids = 1; string release_status = 2; }
message ArchiveSiteMediaRequest { string idempotency_key = 1; string asset_id = 2; }
message ArchiveSiteMediaResponse { SiteMediaAssetSummary asset = 1; }
message TakeDownSiteMediaRequest { string idempotency_key = 1; string asset_id = 2; string reason_code = 3; string reason_note = 4; }
message TakeDownSiteMediaResponse { string operation_id = 1; string delivery_status = 2; }
message GetSiteMediaDeliveryStatusRequest { string asset_id = 1; }
message GetSiteMediaDeliveryStatusResponse { string asset_id = 1; string lifecycle_status = 2; string delivery_status = 3; uint64 availability_version = 4; string last_operation_id = 5; }
message DeleteSiteMediaRequest { string idempotency_key = 1; string asset_id = 2; string deletion_reason = 3; }
message DeleteSiteMediaResponse { string operation_id = 1; string deletion_status = 2; }
