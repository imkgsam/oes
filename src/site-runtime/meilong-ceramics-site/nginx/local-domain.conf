server {
  listen 80;
  server_name meilong-ceramics.com;

  # This local edge preserves the production-shaped Host while proxying to
  # separately deployable Runtime and Storefront units. If you bypass this edge
  # and hit the Nuxt dev server directly with meilong-ceramics.com as Host,
  # configure Nuxt/Vite server.allowedHosts for that host.

  location = /api/oes/webhook {
    proxy_pass http://runtime:4301;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/oes/runtime-status {
    proxy_pass http://runtime:4301;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/ {
    proxy_pass http://runtime:4301;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://storefront:4300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
