# Provides the single-node, file-backed JetStream boundary used only for local OES event-platform proof.
server_name: oes-nats-local
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 536870912
  max_file_store: 17179869184
}

# All credentials come from deployment inputs; this configuration contains no usable secret values.
authorization {
  users: [
    {
      user: $NATS_COLLABORATION_USER
      password: $NATS_COLLABORATION_PASSWORD
      permissions: {
        publish: {
          allow: [
            "oes.events.collaboration.task.assigned"
            "oes.events.collaboration.task.completed"
            "oes.events.collaboration.task.cancelled"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: $NATS_ASSET_USER
      password: $NATS_ASSET_PASSWORD
      permissions: {
        publish: { allow: ["oes.events.asset.site-media.availability.changed"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: $NATS_SITE_USER
      password: $NATS_SITE_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.ACK.OES_BUSINESS_EVENTS.site-service__asset-site-media__v1.>"
            "$JS.API.CONSUMER.INFO.OES_BUSINESS_EVENTS.site-service__asset-site-media__v1"
            "$JS.API.CONSUMER.MSG.NEXT.OES_BUSINESS_EVENTS.site-service__asset-site-media__v1"
            "oes.dlq.site-service.asset-site-media.v1"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: $NATS_NOTIFICATION_USER
      password: $NATS_NOTIFICATION_PASSWORD
      permissions: {
        publish: {
          allow: [
            "oes.dlq.notification-service.collaboration-task.v1"
            "$JS.ACK.OES_BUSINESS_EVENTS.notification-service__collaboration-task__v1.>"
            "$JS.ACK.OES_EVENT_DLQ.notification-service__dlq-inspection__v1.>"
            "$JS.API.CONSUMER.INFO.OES_BUSINESS_EVENTS.notification-service__collaboration-task__v1"
            "$JS.API.CONSUMER.MSG.NEXT.OES_BUSINESS_EVENTS.notification-service__collaboration-task__v1"
            "$JS.API.CONSUMER.INFO.OES_EVENT_DLQ.notification-service__dlq-inspection__v1"
            "$JS.API.CONSUMER.MSG.NEXT.OES_EVENT_DLQ.notification-service__dlq-inspection__v1"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      # This credential is injected per approved SAFE_REDELIVERY run and is unusable for any other consumer or subject.
      user: $NATS_NOTIFICATION_REPLAY_USER
      password: $NATS_NOTIFICATION_REPLAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO"
            $NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT
            $NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT
            $NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT
            $NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT
            $NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT
            $NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT
            $NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT
            $NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT
            $NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT
            $NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      # This recovery identity can observe only Notification's MaxDeliver advisory and cannot fabricate a source ACK/TERM token.
      user: $NATS_NOTIFICATION_RECOVERY_USER
      password: $NATS_NOTIFICATION_RECOVERY_PASSWORD
      permissions: {
        publish: { allow: ["oes.dlq.notification-service.collaboration-task.v1"] }
        subscribe: {
          allow: [
            "_INBOX.>"
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.OES_BUSINESS_EVENTS.notification-service__collaboration-task__v1"
          ]
        }
      }
    }
    {
      user: $NATS_OPERATOR_USER
      password: $NATS_OPERATOR_PASSWORD
      permissions: {
        publish: { allow: ["$JS.API.>"] }
        subscribe: { allow: ["_INBOX.>", "$JS.EVENT.ADVISORY.>"] }
      }
    }
  ]
}
