name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-risk:
    name: Static and Risk Checks
    runs-on: ubuntu-latest
    env:
      OES_CI_TASK_KEY: ci_${{ github.run_id }}_${{ github.run_attempt }}_static

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare task-owned tooling environment
        run: pnpm env:ensure -- --task-key="${OES_CI_TASK_KEY}"

      - name: Resolve immutable proto comparison base
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="${EVENT_BASE_SHA}"
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="origin/main"
          fi
          printf 'OES_PROTO_BREAKING_BASE=%s\n' "${base}" >> "${GITHUB_ENV}"

      - name: Lint proto contracts
        run: pnpm proto:lint

      - name: Generate code once for build and risk tests
        run: pnpm generated:all

      - name: Check proto compatibility
        run: pnpm proto:breaking

      - name: Build Common, Gateway, 21 services, and Site Runtime from prepared code
        run: pnpm build:prepared

      - name: Check non-empty test inventory
        run: pnpm test:matrix:check

      - name: Verify declared design-gap fail-closed lane
        run: pnpm test:design-gap

      - name: Run high-risk unit and contract tests
        run: pnpm test:risk

      - name: Record legacy control identity
        if: ${{ !cancelled() }}
        env:
          OES_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          OES_ACCEPTED_SOURCE_IDENTITY: ${{ github.event.pull_request.head.sha || github.sha }}
          OES_CACHE_DISPOSITION: UNKNOWN
        run: |
          export OES_ACCEPTED_RESULT_IDENTITY="$(git rev-parse HEAD^{tree})"
          node scripts/local/ci-performance-evidence.mjs --mode LEGACY_CONTROL --output .tmp/ci-performance/legacy-control.json

      - name: Upload legacy control evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: legacy-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-performance/legacy-control.json
          if-no-files-found: error
          retention-days: 30

  l2-runtime:
    name: L2 Runtime Checks
    runs-on: ubuntu-latest
    env:
      OES_CI_TASK_KEY: ci_${{ github.run_id }}_${{ github.run_attempt }}_l2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated task-owned L2 tests
        run: pnpm test:l2

      - name: Verify task-owned runtime cleanup
        if: always()
        run: |
          state=".tmp/oes-database-lifecycle/${OES_CI_TASK_KEY}/state.json"
          if [[ -f "${state}" ]]; then
            pnpm db:rollback
          fi
          test -z "$(docker ps -aq --filter "label=oes.local.owner=${OES_CI_TASK_KEY}")"
          test -z "$(docker volume ls -q --filter "label=oes.local.owner=${OES_CI_TASK_KEY}")"
          test -z "$(docker network ls -q --filter "label=oes.local.owner=${OES_CI_TASK_KEY}")"
          printf 'CI_TASK_RESIDUE=0 owner=%s\n' "${OES_CI_TASK_KEY}"

  baseline:
    name: Baseline Checks
    if: ${{ always() }}
    needs: [static-risk, l2-runtime]
    runs-on: ubuntu-latest

    steps:
      - name: Aggregate complete fail-closed gate
        env:
          STATIC_RISK_RESULT: ${{ needs.static-risk.result }}
          L2_RUNTIME_RESULT: ${{ needs.l2-runtime.result }}
        run: |
          test "${STATIC_RISK_RESULT}" = "success"
          test "${L2_RUNTIME_RESULT}" = "success"
          printf 'BASELINE_CHECKS=PASS static-risk=%s l2-runtime=%s\n' \
            "${STATIC_RISK_RESULT}" "${L2_RUNTIME_RESULT}"
