# File: docker-compose.yml
services:
  # ============ Infrastructure ============
  postgres:
    image: "bitnami/postgresql:latest"
    container_name: oes_postgres
    environment:
      - POSTGRESQL_USERNAME=imkgsam
      - POSTGRESQL_PASSWORD=imkgsam
      - POSTGRESQL_DATABASE=mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - oes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imkgsam -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    container_name: oes_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oes_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ Local Event Bus Proof (single-node only) ============
  nats:
    image: nats:2.10.26-alpine
    container_name: oes_nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_COLLABORATION_USER: "${NATS_COLLABORATION_USER:?NATS_COLLABORATION_USER is required}"
      NATS_COLLABORATION_PASSWORD: "${NATS_COLLABORATION_PASSWORD:?NATS_COLLABORATION_PASSWORD is required}"
      NATS_NOTIFICATION_USER: "${NATS_NOTIFICATION_USER:?NATS_NOTIFICATION_USER is required}"
      NATS_NOTIFICATION_PASSWORD: "${NATS_NOTIFICATION_PASSWORD:?NATS_NOTIFICATION_PASSWORD is required}"
      NATS_NOTIFICATION_REPLAY_USER: "${NATS_NOTIFICATION_REPLAY_USER:?NATS_NOTIFICATION_REPLAY_USER is required}"
      NATS_NOTIFICATION_REPLAY_PASSWORD: "${NATS_NOTIFICATION_REPLAY_PASSWORD:?NATS_NOTIFICATION_REPLAY_PASSWORD is required}"
      NATS_NOTIFICATION_RECOVERY_USER: "${NATS_NOTIFICATION_RECOVERY_USER:?NATS_NOTIFICATION_RECOVERY_USER is required}"
      NATS_NOTIFICATION_RECOVERY_PASSWORD: "${NATS_NOTIFICATION_RECOVERY_PASSWORD:?NATS_NOTIFICATION_RECOVERY_PASSWORD is required}"
      NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT:?NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT:?NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT:?NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT: "${NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT:?NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT: "${NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT:?NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT: "${NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT:?NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT:?NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT:?NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT: "${NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT:?NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT: "${NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT:?NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT: "${NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT:?NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT: "${NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT:?NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT: "${NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT:?NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT: "${NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT:?NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT is required}"
      NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT: "${NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT:?NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT is required}"
      NATS_OPERATOR_USER: "${NATS_OPERATOR_USER:?NATS_OPERATOR_USER is required}"
      NATS_OPERATOR_PASSWORD: "${NATS_OPERATOR_PASSWORD:?NATS_OPERATOR_PASSWORD is required}"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_jetstream_data:/data
    networks:
      - oes_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz?js-enabled-only >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  nats-bootstrap:
    image: natsio/nats-box:0.14.5
    container_name: oes_nats_bootstrap
    environment:
      NATS_OPERATOR_USER: "${NATS_OPERATOR_USER:?NATS_OPERATOR_USER is required}"
      NATS_OPERATOR_PASSWORD: "${NATS_OPERATOR_PASSWORD:?NATS_OPERATOR_PASSWORD is required}"
    entrypoint: ["/bin/sh", "/etc/nats/bootstrap.sh"]
    volumes:
      - ./docker/nats/bootstrap.sh:/etc/nats/bootstrap.sh:ro
      - ./docker/nats/topology:/etc/nats/topology:ro
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - oes_network
    restart: "no"

  nats-advisory-monitor:
    image: natsio/nats-box:0.14.5
    container_name: oes_nats_advisory_monitor
    environment:
      NATS_OPERATOR_USER: "${NATS_OPERATOR_USER:?NATS_OPERATOR_USER is required}"
      NATS_OPERATOR_PASSWORD: "${NATS_OPERATOR_PASSWORD:?NATS_OPERATOR_PASSWORD is required}"
    entrypoint: ["/bin/sh", "/etc/nats/advisory-monitor.sh"]
    volumes:
      - ./docker/nats/advisory-monitor.sh:/etc/nats/advisory-monitor.sh:ro
    depends_on:
      nats-bootstrap:
        condition: service_completed_successfully
    networks:
      - oes_network
    restart: unless-stopped

  # ============ OpenTelemetry Stack ============
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: oes_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./docker/output/otel-logs:/var/log/oes
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
    networks:
      - oes_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: oes_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=oesminio
      - MINIO_ROOT_PASSWORD=oesminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - oes_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: oes_minio_init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 oesminio oesminio123; do
          echo "waiting for minio to become ready..."
          sleep 2
        done
        mc mb --ignore-existing local/oes-assets
        mc anonymous set download local/oes-assets
    networks:
      - oes_network
    restart: "no"

  tempo:
    image: grafana/tempo:2.8.2
    container_name: oes_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /tmp/tempo:mode=1777,uid=0,gid=0
    ports:
      - "3200:3200"
    networks:
      - oes_network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: oes_loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/otel/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs:
      - /tmp/loki:mode=1777,uid=0,gid=0
    ports:
      - "3100:3100"
    networks:
      - oes_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.2
    container_name: oes_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
    networks:
      - oes_network
    restart: unless-stopped

  # ============ Nacos Service Registry ============
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=ip
      - MYSQL_SERVICE_DB_URL=jdbc:mysql://mysql:3306/nacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKeydDB1Wczf4sySUfF5NVgCq6vuC+w+4ntDlrKuSCEaIfY=
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - mysql
    volumes:
      - ./docker/output/nacos/logs:/home/nacos/logs
    networks:
      - oes_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: nacos-mysql
    command: --default-authentication-plugin=mysql_native_password # <--- 新增这一行
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nacos
      - MYSQL_USER=nacos
      - MYSQL_PASSWORD=nacos
    ports:
      - "3307:3306"
    volumes:
      - nacos_mysql_data:/var/lib/mysql
      - ./docker/output/nacos/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - oes_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nacos_mysql_data:
  grafana_data:
  nats_jetstream_data:

networks:
  oes_network:
    driver: bridge
