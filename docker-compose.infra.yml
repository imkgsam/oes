name: ${OES_COMPOSE_PROJECT:?run pnpm db:config or pnpm db:up}

x-owner-labels: &owner-labels
  oes.local.owner: ${OES_TASK_KEY:?run pnpm env:bootstrap}
  oes.local.scope: infrastructure-databases

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    labels: *owner-labels
    environment:
      POSTGRES_USER: ${OES_POSTGRES_USER:?OES_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${OES_POSTGRES_PASSWORD:?OES_POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports: ['127.0.0.1::5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [oes_network]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    labels: *owner-labels
    ports: ['127.0.0.1::6379']
    volumes: [redis_data:/data]
    networks: [oes_network]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.10.26-alpine@sha256:d69eb29526c1d98afdfb2e2434763bef77b5f3c83e2e24769c13a4d104be475e
    labels: *owner-labels
    command: ['-c', '/etc/nats/nats-server.conf']
    environment:
      NATS_COLLABORATION_USER: ${NATS_COLLABORATION_USER:?generated local NATS input is required}
      NATS_COLLABORATION_PASSWORD: ${NATS_COLLABORATION_PASSWORD:?generated local NATS input is required}
      NATS_NOTIFICATION_USER: ${NATS_NOTIFICATION_USER:?generated local NATS input is required}
      NATS_NOTIFICATION_PASSWORD: ${NATS_NOTIFICATION_PASSWORD:?generated local NATS input is required}
      NATS_ASSET_USER: ${NATS_ASSET_USER:?generated local NATS input is required}
      NATS_ASSET_PASSWORD: ${NATS_ASSET_PASSWORD:?generated local NATS input is required}
      NATS_SITE_USER: ${NATS_SITE_USER:?generated local NATS input is required}
      NATS_SITE_PASSWORD: ${NATS_SITE_PASSWORD:?generated local NATS input is required}
      NATS_NOTIFICATION_REPLAY_USER: ${NATS_NOTIFICATION_REPLAY_USER:?generated local NATS input is required}
      NATS_NOTIFICATION_REPLAY_PASSWORD: ${NATS_NOTIFICATION_REPLAY_PASSWORD:?generated local NATS input is required}
      NATS_NOTIFICATION_RECOVERY_USER: ${NATS_NOTIFICATION_RECOVERY_USER:?generated local NATS input is required}
      NATS_NOTIFICATION_RECOVERY_PASSWORD: ${NATS_NOTIFICATION_RECOVERY_PASSWORD:?generated local NATS input is required}
      NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_ASSIGNED_CREATE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_COMPLETED_CREATE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_CANCELLED_CREATE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT: ${NATS_NOTIFICATION_REPLAY_ASSIGNED_INFO_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT: ${NATS_NOTIFICATION_REPLAY_COMPLETED_INFO_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT: ${NATS_NOTIFICATION_REPLAY_CANCELLED_INFO_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_ASSIGNED_DELETE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_COMPLETED_DELETE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT: ${NATS_NOTIFICATION_REPLAY_CANCELLED_DELETE_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT: ${NATS_NOTIFICATION_REPLAY_ASSIGNED_NEXT_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT: ${NATS_NOTIFICATION_REPLAY_COMPLETED_NEXT_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT: ${NATS_NOTIFICATION_REPLAY_CANCELLED_NEXT_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT: ${NATS_NOTIFICATION_REPLAY_ASSIGNED_ACK_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT: ${NATS_NOTIFICATION_REPLAY_COMPLETED_ACK_SUBJECT:?generated local NATS ACL is required}
      NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT: ${NATS_NOTIFICATION_REPLAY_CANCELLED_ACK_SUBJECT:?generated local NATS ACL is required}
      NATS_OPERATOR_USER: ${NATS_OPERATOR_USER:?generated local NATS input is required}
      NATS_OPERATOR_PASSWORD: ${NATS_OPERATOR_PASSWORD:?generated local NATS input is required}
    ports: ['127.0.0.1::4222', '127.0.0.1::8222']
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_jetstream_data:/data
    networks: [oes_network]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8222/healthz?js-enabled-only >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  nats-bootstrap:
    image: natsio/nats-box:0.14.5@sha256:0784ab710aefaf6ef037ed797ee7dcde613c6ad208c4dbff1945fc7c1b5b5375
    labels: *owner-labels
    environment:
      NATS_OPERATOR_USER: ${NATS_OPERATOR_USER:?generated local NATS input is required}
      NATS_OPERATOR_PASSWORD: ${NATS_OPERATOR_PASSWORD:?generated local NATS input is required}
    entrypoint: ['/bin/sh', '/etc/nats/bootstrap.sh']
    volumes:
      - ./docker/nats/bootstrap.sh:/etc/nats/bootstrap.sh:ro
      - ./docker/nats/topology:/etc/nats/topology:ro
    depends_on:
      nats:
        condition: service_healthy
    networks: [oes_network]
    restart: 'no'

  nats-advisory-monitor:
    image: natsio/nats-box:0.14.5@sha256:0784ab710aefaf6ef037ed797ee7dcde613c6ad208c4dbff1945fc7c1b5b5375
    labels: *owner-labels
    environment:
      NATS_OPERATOR_USER: ${NATS_OPERATOR_USER:?generated local NATS input is required}
      NATS_OPERATOR_PASSWORD: ${NATS_OPERATOR_PASSWORD:?generated local NATS input is required}
    entrypoint: ['/bin/sh', '/etc/nats/advisory-monitor.sh']
    volumes:
      - ./docker/nats/advisory-monitor.sh:/etc/nats/advisory-monitor.sh:ro
    depends_on:
      nats-bootstrap:
        condition: service_completed_successfully
    networks: [oes_network]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    labels: *owner-labels
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?generated local MinIO input is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generated local MinIO input is required}
    ports: ['127.0.0.1::9000', '127.0.0.1::9001']
    volumes: [minio_data:/data]
    networks: [oes_network]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    labels: *owner-labels
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?generated local MinIO input is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?generated local MinIO input is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-oes-local-assets}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set download "local/$${MINIO_BUCKET}"
    networks: [oes_network]
    restart: 'no'

  tempo:
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    labels: *owner-labels
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes: [./docker/otel/tempo.yaml:/etc/tempo/tempo.yaml:ro]
    tmpfs: ['/tmp/tempo:mode=1777,uid=0,gid=0']
    ports: ['127.0.0.1::3200']
    networks: [oes_network]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    labels: *owner-labels
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes: [./docker/otel/loki.yaml:/etc/loki/loki.yaml:ro]
    tmpfs: ['/tmp/loki:mode=1777,uid=0,gid=0']
    ports: ['127.0.0.1::3100']
    networks: [oes_network]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    labels: *owner-labels
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./docker/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_logs:/var/log/oes
    ports: ['127.0.0.1::4317', '127.0.0.1::4318', '127.0.0.1::13133']
    depends_on: [tempo, loki]
    networks: [oes_network]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.2@sha256:a3464c5dadc2e16aaeb813aead8c852e81cc7bbfa851c66d96f016d5257b9848
    labels: *owner-labels
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?generated local Grafana input is required}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports: ['127.0.0.1::3000']
    depends_on: [tempo, loki]
    networks: [oes_network]
    restart: unless-stopped

  mysql:
    image: mysql:8.0@sha256:a3dff78d876222746a0bacc36dd7e4bf9e673c85fb7ee0d12ed25bd32c43c19b
    command: ['--default-authentication-plugin=mysql_native_password']
    labels: *owner-labels
    environment:
      MYSQL_ROOT_PASSWORD: ${NACOS_MYSQL_ROOT_PASSWORD:?generated local MySQL input is required}
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: ${NACOS_MYSQL_PASSWORD:?generated local MySQL input is required}
    ports: ['127.0.0.1::3306']
    volumes:
      - nacos_mysql_data:/var/lib/mysql
      - ./docker/nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
    networks: [oes_network]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.5.1@sha256:8987908cb94ed5f9d30522a64493d35732a6c05f216d667a7addb022f3d92e80
    labels: *owner-labels
    environment:
      MODE: standalone
      PREFER_HOST_MODE: ip
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD:?generated local MySQL input is required}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?generated local Nacos input is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?generated local Nacos input is required}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports: ['127.0.0.1::8848', '127.0.0.1::9848', '127.0.0.1::9849']
    volumes: [nacos_logs:/home/nacos/logs]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [oes_network]
    restart: unless-stopped

  nacos-auth-bootstrap:
    image: mysql:8.0@sha256:a3dff78d876222746a0bacc36dd7e4bf9e673c85fb7ee0d12ed25bd32c43c19b
    labels: *owner-labels
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_PWD: ${NACOS_MYSQL_PASSWORD:?generated local MySQL input is required}
      NACOS_USERNAME: ${NACOS_USERNAME:?generated local Nacos user is required}
      NACOS_PASSWORD_BCRYPT: ${NACOS_PASSWORD_BCRYPT:?generated local Nacos hash is required}
    command:
      - sh
      - -ec
      - |
        mysql -h mysql -u nacos nacos <<SQL
        INSERT INTO users(username,password,enabled) VALUES ('$${NACOS_USERNAME}','$${NACOS_PASSWORD_BCRYPT}',TRUE)
          ON DUPLICATE KEY UPDATE password=VALUES(password),enabled=TRUE;
        INSERT INTO roles(username,role) VALUES ('$${NACOS_USERNAME}','ROLE_ADMIN')
          ON DUPLICATE KEY UPDATE role=VALUES(role);
        SQL
        test "$$(mysql -N -s -h mysql -u nacos nacos -e "SELECT COUNT(*) FROM users u JOIN roles r USING(username) WHERE u.username='$${NACOS_USERNAME}' AND u.enabled=TRUE AND r.role='ROLE_ADMIN'")" = 1
    networks: [oes_network]

volumes:
  postgres_data: { labels: *owner-labels }
  redis_data: { labels: *owner-labels }
  nats_jetstream_data: { labels: *owner-labels }
  minio_data: { labels: *owner-labels }
  grafana_data: { labels: *owner-labels }
  otel_logs: { labels: *owner-labels }
  nacos_mysql_data: { labels: *owner-labels }
  nacos_logs: { labels: *owner-labels }

networks:
  oes_network:
    labels: *owner-labels
    driver: bridge
