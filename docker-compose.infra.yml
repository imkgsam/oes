# File: docker-compose.yml
services:
  # ============ Infrastructure ============
  postgres:
    image: "bitnami/postgresql:latest"
    container_name: oes_postgres
    environment:
      - POSTGRESQL_USERNAME=imkgsam
      - POSTGRESQL_PASSWORD=imkgsam
      - POSTGRESQL_DATABASE=mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - oes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imkgsam -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    container_name: oes_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oes_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ OpenTelemetry Stack ============
  # Jaeger v2 - 基于 OpenTelemetry Collector 架构
  # 直接接收 OTLP 数据，无需单独的 OTel Collector
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.14.1
    container_name: oes_jaeger
    volumes:
      - ./otel/jaeger-v2-config.yaml:/etc/jaeger/config.yaml
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "16686:16686" # Jaeger UI
    networks:
      - oes_network
    environment:
      - METRICS_STORAGE_TYPE=prometheus
    restart: unless-stopped

  # ============ Nacos Service Registry ============
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=ip
      - MYSQL_SERVICE_DB_URL=jdbc:mysql://mysql:3306/nacos?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKeydDB1Wczf4sySUfF5NVgCq6vuC+w+4ntDlrKuSCEaIfY=
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - mysql
    volumes:
      - ./nacos/logs:/home/nacos/logs
    networks:
      - oes_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: nacos-mysql
    command: --default-authentication-plugin=mysql_native_password # <--- 新增这一行
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nacos
      - MYSQL_USER=nacos
      - MYSQL_PASSWORD=nacos
    ports:
      - "3307:3306"
    volumes:
      - nacos_mysql_data:/var/lib/mysql
      - ./nacos/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - oes_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nacos_mysql_data:

networks:
  oes_network:
    driver: bridge
