user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  server {
    listen 443 ssl;
    server_name issuer.local.oes.internal;
    ssl_certificate /auth-trust/current/cert.pem;
    ssl_certificate_key /auth-trust/current/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != issuer.local.oes.internal) { return 421; }
    location = /.well-known/openid-configuration { proxy_pass http://127.0.0.1:50051; proxy_set_header Host issuer.local.oes.internal; }
    location = /.well-known/jwks.json { proxy_pass http://127.0.0.1:50051; proxy_set_header Host issuer.local.oes.internal; }
    location / { return 404; }
  }
}
